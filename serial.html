<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --line2:#eef0f3;
  --txt:#1c2128; --mut:#6b7480; --acc:#1f6feb; --acc-bg:#e8f0fe;
  --ok:#1a7f4b; --ok-bg:#e6f5ec; --warn:#a8630a; --warn-bg:#fdf3e3;
  --bad:#c0392b; --bad-bg:#fdecea; --radius:8px;
  --teal:#3b7d8c; --orange:#e08600;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
h1 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px}
.homelink{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mut);
  font-size:12.5px;padding:4px 10px 4px 5px;border:1px solid var(--line);border-radius:99px;
  white-space:nowrap;transition:.15s}
.homelink:hover{background:var(--line2);color:var(--txt);border-color:#cfd5db}
.homelink img{height:20px;width:auto;display:block}
.navlink{display:inline-flex;align-items:center;padding:7px 13px;border-radius:6px;
  font-size:13.5px;color:var(--mut);text-decoration:none;white-space:nowrap}
.navlink:hover{background:var(--line2);color:var(--txt)}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 13px;border-radius:6px;cursor:pointer;
  font-size:13.5px;color:var(--mut);font-family:inherit}
nav button:hover{background:var(--line2);color:var(--txt)}
nav button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
#meBox{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);
  white-space:nowrap;margin-left:auto}
#meBox b{color:var(--txt)}
main{padding:18px;max-width:1600px;margin:0 auto}
.view{display:none} .view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card>h2{font-size:14px;margin:0 0 12px;font-weight:650}
.card>h2 .sub{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:180px}
input,select,textarea,button{font-family:inherit;font-size:13.5px}
input[type=text],input[type=search],input[type=number],select,textarea{
  padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
.btn{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:#f0c3bd}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:11.5px;color:var(--mut);letter-spacing:.5px}
.stat .v{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:#fafbfc;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:2;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th.nos{cursor:default}
th .ar{color:var(--acc);font-size:10px}
td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.mut{color:var(--mut)}
.wrapcell{white-space:pre-wrap;word-break:break-word;min-width:150px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--acc-bg);color:var(--acc)}
.tag.gray{background:var(--line2);color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(760px,94vw);width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(20,24,30,.42)}
.dlg-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dlg-h b{font-size:14.5px;flex:1}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:12.5px;background:#fff}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.ro-banner{background:#fff8e6;border:1px solid #f0dca8;color:#8a6414;
  padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.6}
.seed-banner{background:var(--acc-bg);border:1px solid #bcd3f7;color:#14418f;
  padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.7}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2128;color:#fff;
  padding:10px 18px;border-radius:7px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.on{opacity:1}
input[type=file]{display:none}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.rulebox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.rulebox .h{font-size:12px;color:var(--mut);margin-bottom:6px}
.rulebox .b{font-size:13px;line-height:2.05}
.rulebox .b i{font-style:normal;display:inline-block;white-space:nowrap;margin-right:12px}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:4px;
  background:#f2f5f8;border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:center}
.codebox span{display:inline-block;padding:0 2px;border-radius:4px}
.c-y{background:#dfeef2;color:#1d5a68}
.c-m{background:#fdf0d8;color:#8a5a06}
.c-b{background:#e4ecfb;color:#1a4ea8}
.c-s{background:#eaf3ea;color:#1a6b38}
.genbox{margin-top:4px;border:1px dashed var(--line);border-radius:8px;padding:16px;
  text-align:center;color:var(--mut);font-size:13px;background:#fafbfc}
.genbox.on{border-style:solid;border-color:#bcd3f7;background:var(--acc-bg);color:var(--txt)}
.gencode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;font-weight:600;
  letter-spacing:2px;color:#14418f;word-break:break-all}
.genmeta{margin-top:8px;font-size:12.5px;color:var(--mut);line-height:1.9}
.genmeta .tag{margin-right:8px}
details summary::-webkit-details-marker{color:var(--mut)}
/* 登入畫面 */
#gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;overflow:auto;padding:40px 16px}
#gate.on{display:block}
.gate-box{max-width:430px;margin:0 auto;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:26px 26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-box h2{margin:0 0 4px;font-size:19px}
.gate-box .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.gate-tabs{display:flex;gap:2px;background:var(--line2);padding:3px;border-radius:8px;margin-bottom:18px}
.gate-tabs button{flex:1;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;
  font-size:13.5px;color:var(--mut);font-family:inherit}
.gate-tabs button.on{background:#fff;color:var(--acc);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gate-msg{font-size:13px;padding:9px 11px;border-radius:7px;margin-bottom:14px;line-height:1.6}
.gate-msg.bad{background:#fdecec;color:#a62222;border:1px solid #f3c6c6}
.gate-msg.ok{background:#e9f7ee;color:#1a6b38;border:1px solid #bfe3cd}
.gate-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mut);line-height:1.7}
.gate-foot a{color:var(--acc);cursor:pointer;text-decoration:underline}
</style>
</head>

  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nowts(){
  const d=new Date(), p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+
         p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
let TOASTT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(TOASTT); TOASTT=setTimeout(()=>t.classList.remove('on'),2600); }
function dialog(title,bodyHTML,footHTML){
  $('#dlgTitle').textContent=title; $('#dlgBody').innerHTML=bodyHTML;
  $('#dlgFoot').innerHTML=footHTML||'<button class="btn" value="x">關閉</button>';
  const d=$('#dlg'); if(!d.open) d.showModal();
}
function closeDlg(){ const d=$('#dlg'); if(d.open) d.close(); }

/* ---------- IndexedDB 極簡 KV ---------- */
const DB=(()=>{ let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('serialdb',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=async(mode,fn)=>{ const db=await open();
    return new Promise((res,rej)=>{ const t=db.transaction('kv',mode);
      const rq=fn(t.objectStore('kv')); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); };
  return { get:k=>tx('readonly',s=>s.get(k)), set:(k,v)=>tx('readwrite',s=>s.put(v,k)) };
})();
</script>

<script>
/* ============================================================
   登入 / 權限 / 雲端同步（與 BOM 系統共用同一組憑證）
   ============================================================ */
const TKKEY='bom_token_v1', PWKEY='bom_pw_v2', WHOKEY='bom_who_v1';
const LS={get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},
          set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},
          del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
let TOKEN=LS.get(TKKEY), PW=LS.get(PWKEY), WHO=LS.get(WHOKEY);
let ME=null, REV=0, NET='idle', LASTSYNC='', SAVING=false;
const ROLE_NAME={admin:'管理員', editor:'編輯', viewer:'唯讀'};
function myRole(){ return (ME&&ME.role)||'viewer'; }
function canWrite(){ return !CLOUD || myRole()==='admin' || myRole()==='editor'; }
function denyWrite(){ toast(ME&&ME.legacy
  ? '共用密碼為唯讀模式，請註冊個人帳號後由管理員給予編輯權限'
  : '你的權限為「唯讀」，無法修改資料。請聯絡管理員調整權限'); }

function setNet(s){ NET=s; paintNet(); }
function paintNet(){
  const el=$('#netBox'); if(!el) return;
  const map={idle:['','gray'],load:['讀取雲端中…','info'],ok:['已同步','ok'],
    save:['儲存中…','info'],err:['雲端連線失敗','bad'],conflict:['版本衝突','warn'],local:['本機模式','gray']};
  const m=map[NET]||['',''];
  el.innerHTML = CLOUD
    ? '<span class="tag '+m[1]+'">'+m[0]+(NET==='ok'&&LASTSYNC?' '+LASTSYNC.slice(-8):'')+'</span>'+
      '<button class="btn sm" onclick="pullNow()" title="重新讀取雲端資料">↻</button>'
    : '<span class="tag gray">本機模式</span>';
}
function paintMe(){
  const el=$('#meBox'); if(!el) return;
  if(!CLOUD){ el.innerHTML=''; return; }
  if(!ME){ el.innerHTML='<span class="tag bad">未登入</span>'+
      '<button class="btn sm" onclick="openGate(\'login\')">登入</button>'; return; }
  const t = ME.legacy ? '<span class="tag warn">共用密碼·唯讀</span>'
    : '<span class="tag '+(myRole()==='viewer'?'gray':'ok')+'">'+esc(ME.roleName||ROLE_NAME[myRole()])+'</span>';
  el.innerHTML='<b>'+esc(ME.name||'')+'</b>'+t+'<button class="btn sm" onclick="logout()">登出</button>';
  const na=document.getElementById('navAcct');
  if(na) na.style.display = (ME && !ME.legacy) ? '' : 'none';
}
function logout(){
  TOKEN=''; PW=''; ME=null; LS.del(TKKEY); LS.del(PWKEY);
  R=[]; REV=0; renderAll(); openGate('login','已登出');
}

async function apiPost(action,payload,extra){
  const body=Object.assign({action:action,payload:payload,token:TOKEN,pw:PW,who:WHO},extra||{});
  let lastErr;
  const tries=(action==='saveSerial')?1:2;
  for(let i=0;i<tries;i++){
    try{
      const res=await fetch(API_URL,{method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){ lastErr=e; if(i+1<tries) await new Promise(r=>setTimeout(r,1200)); }
  }
  throw lastErr;
}

async function whoAmI(){
  try{
    const d=await apiPost('me',null);
    if(d.error){ if(d.needLogin) openGate('login', d.error); return false; }
    ME={id:d.id,name:d.name,email:d.email,role:d.role,legacy:!!d.legacy,
        roleName:d.roleName||ROLE_NAME[d.role]||'唯讀'};
    WHO=ME.name||WHO; closeGate(); paintMe(); return true;
  }catch(e){ return false; }
}

async function pull(silent){
  if(!CLOUD) return false;
  setNet('load');
  try{
    const d=await apiPost('loadSerial',null);
    if(d.error){
      setNet('err');
      if(d.needLogin){ openGate('login', d.error); return false; }
      if(!silent) toast(d.error);
      return false;
    }
    R = (d.records||[]).map(normRec);
    REV = d.rev||0; LASTSYNC = d.updatedAt||'';
    META = {updatedAt:d.updatedAt||'', updatedBy:d.updatedBy||''};
    await DB.set('cache',JSON.parse(JSON.stringify({R:R,REV:REV,META:META})));
    setNet('ok');
    return true;
  }catch(e){
    setNet('err');
    if(!silent) toast('連不上雲端（'+(e.message||'網路逾時')+'），顯示的是本機快取。可按 ↻ 重試');
    return false;
  }
}
async function pullNow(){ if(await pull()){ await whoAmI(); renderAll(); toast('已重新讀取雲端資料'); } }

async function push(force){
  if(!CLOUD){ await DB.set('cache',JSON.parse(JSON.stringify({R:R,REV:REV,META:META}))); return true; }
  if(!canWrite()){ denyWrite(); return false; }
  if(SAVING){ return false; }
  SAVING=true; setNet('save');
  try{
    const d=await apiPost('saveSerial',R,{baseRev:force?null:REV,force:!!force});
    SAVING=false;
    if(d.conflict){
      setNet('conflict');
      dialog('雲端資料已被別人更新',
        '<p>你載入資料後，<b>'+esc(d.updatedBy||'其他使用者')+'</b> 在 <b>'+esc(d.updatedAt||'')+
        '</b> 也存過一次（雲端版本 '+d.serverRev+'，你的是 '+REV+'）。</p>'+
        '<div class="hint">建議先「放棄我的修改並重新載入」確認雲端內容，再重做一次修改。</div>',
        '<button class="btn danger" type="button" onclick="closeDlg();push(true)">強制覆蓋雲端</button>'+
        '<button class="btn pri" type="button" onclick="closeDlg();pullNow()">放棄我的修改並重新載入</button>'+
        '<button class="btn" value="x">稍後再說</button>');
      return false;
    }
    if(d.error){ setNet('err'); toast(d.error); return false; }
    REV=d.rev||REV; LASTSYNC=d.updatedAt||nowts();
    META={updatedAt:LASTSYNC, updatedBy:(ME&&ME.name)||WHO||''};
    await DB.set('cache',JSON.parse(JSON.stringify({R:R,REV:REV,META:META})));
    setNet('ok');
    return true;
  }catch(e){ SAVING=false; setNet('err'); toast('儲存失敗：'+(e.message||'網路逾時')); return false; }
}

/* ---------- 登入畫面 ---------- */
let GATE_TAB='login', GATE_MSG='', GATE_MSG_OK=false, GATE_BUSY=false;
function openGate(tab,msg,ok){ GATE_TAB=tab||'login'; GATE_MSG=msg||''; GATE_MSG_OK=!!ok;
  $('#gate').classList.add('on'); paintGate(); }
function closeGate(){ $('#gate').classList.remove('on'); GATE_MSG=''; GATE_BUSY=false; }
function gateTab(t){ GATE_TAB=t; GATE_MSG=''; paintGate(); }
function paintGate(){
  const msg = GATE_MSG ? '<div class="gate-msg '+(GATE_MSG_OK?'ok':'bad')+'">'+esc(GATE_MSG)+'</div>' : '';
  const tabs = '<div class="gate-tabs">'+
    '<button type="button" class="'+(GATE_TAB==='login'?'on':'')+'" onclick="gateTab(\'login\')">登入</button>'+
    '<button type="button" class="'+(GATE_TAB==='legacy'?'on':'')+'" onclick="gateTab(\'legacy\')">共用密碼</button>'+
    '</div>';
  let body;
  if(GATE_TAB==='login'){
    body = tabs+msg+
      '<div class="fld"><label>Email</label><input id="g_email" type="email" value="'+
        esc(LS.get('bom_last_email'))+'" placeholder="you@company.com"></div>'+
      '<div class="fld"><label>密碼</label><input id="g_pw" type="password" placeholder="請輸入密碼"></div>'+
      '<button class="btn pri" type="button" style="width:100%;margin-top:6px" onclick="doLogin()"'+
        (GATE_BUSY?' disabled':'')+'>'+(GATE_BUSY?'登入中…':'登入')+'</button>'+
      '<div class="gate-foot">與 BOM 管理系統共用同一組帳號。還沒有帳號請到'+
        '<a href="bom.html">料號系統</a>的「申請帳號」建立。</div>';
  }else{
    body = tabs+msg+
      '<div class="gate-msg" style="background:var(--line2);color:var(--mut);border:1px solid var(--line)">'+
        '過渡期用的舊共用密碼，登入後<b>只能查看、不能修改</b>資料。</div>'+
      '<div class="fld"><label>你的名字</label><input id="l_who" value="'+esc(WHO)+'" placeholder="例：謝嘉元"></div>'+
      '<div class="fld"><label>共用密碼</label><input id="l_pw" type="password" placeholder="請向管理者索取"></div>'+
      '<button class="btn" type="button" style="width:100%;margin-top:6px" onclick="doLegacy()">以唯讀身分進入</button>';
  }
  $('#gateBox').innerHTML =
    '<h2>產品批序號管理</h2><div class="sub">安德斯醫學科技　批號 · 序號 · 發放紀錄</div>'+body+
    '<div class="gate-foot" style="margin-top:12px"><a href="index.html">← 回系統入口</a></div>';
  const box=$('#gateBox');
  setTimeout(()=>{ const t=box.querySelector('#g_pw,#l_pw'); if(t) t.focus(); },60);
  box.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); GATE_TAB==='login'?doLogin():doLegacy(); }});
}
async function doLogin(){
  if(GATE_BUSY) return;
  const email=$('#g_email').value.trim(), pw=$('#g_pw').value;
  if(!email||!pw){ GATE_MSG='請輸入 Email 與密碼'; GATE_MSG_OK=false; return paintGate(); }
  GATE_BUSY=true; paintGate();
  try{
    const d=await apiPost('login',null,{email:email,password:pw,token:'',pw:''});
    GATE_BUSY=false;
    if(d.error){ GATE_MSG=d.error; GATE_MSG_OK=false; return paintGate(); }
    TOKEN=d.token; ME=d.profile; ME.roleName=ME.roleName||ROLE_NAME[ME.role]||'唯讀';
    WHO=ME.name; PW='';
    LS.set(TKKEY,TOKEN); LS.set(WHOKEY,WHO); LS.set('bom_last_email',email); LS.del(PWKEY);
    closeGate(); await pull(); renderAll();
    toast('已登入：'+ME.name+'（'+ME.roleName+'）');
  }catch(e){ GATE_BUSY=false; GATE_MSG='連不上伺服器：'+(e.message||'網路逾時'); GATE_MSG_OK=false; paintGate(); }
}
async function doLegacy(){
  WHO=$('#l_who').value.trim(); PW=$('#l_pw').value;
  if(!PW){ GATE_MSG='請輸入共用密碼'; GATE_MSG_OK=false; return paintGate(); }
  TOKEN=''; LS.del(TKKEY); LS.set(PWKEY,PW); LS.set(WHOKEY,WHO);
  closeGate();
  if(await whoAmI()){ await pull(); renderAll(); }
  else { openGate('legacy','共用密碼不正確'); }
}
</script>

<script>
/* ============================================================
   批號規則
   批號 3 碼 ＝ 年碼 + 月碼 + 當月批次碼；序號 4 碼接在批號後面
   年碼：A=2024、B=2025、C=2026 …　月碼：A=1月 … L=12月　批次碼：A、B、C …
   ============================================================ */
const YEAR0 = 2024;
function letterYear(ch){ const i=ch.charCodeAt(0)-65; return (i>=0&&i<=25)?YEAR0+i:null; }
function yearLetter(y){ const i=y-YEAR0; return (i>=0&&i<=25)?String.fromCharCode(65+i):null; }
function letterMonth(ch){ const i=ch.charCodeAt(0)-64; return (i>=1&&i<=12)?i:null; }
function monthLetter(m){ return (m>=1&&m<=12)?String.fromCharCode(64+m):null; }

/* 從「批號/序號」欄位解析出年 / 月 / 批次；PRBEA0001 這種前綴會被保留在 prefix */
function decodeSn(sn){
  const m=String(sn||'').toUpperCase().match(/([A-Z]{2,})\s*(\d{3,4})?/);
  if(!m) return null;
  const L=m[1]; if(L.length<3) return null;
  const core=L.slice(-3);
  return {prefix:L.slice(0,-3), core:core, serial:m[2]||'',
          year:letterYear(core[0]), month:letterMonth(core[1]), batch:core[2]};
}
/* 日期欄可能是 20240513 / 202406 / 2026 / 2026/03/13 */
function parseYM(d){
  const s=String(d||'').replace(/[^0-9]/g,'');
  if(s.length>=6) return {y:+s.slice(0,4), m:+s.slice(4,6)};
  if(s.length===4) return {y:+s, m:null};
  return null;
}
/* 批號與日期是否一致；回傳 'ok' / 'diff' / '' */
function snMatch(rec){
  const a=decodeSn(rec.sn), b=parseYM(rec.date);
  if(!a||!b||a.year===null) return '';
  if(b.m===null) return a.year===b.y?'ok':'diff';
  if(a.month===null) return '';
  return (a.year===b.y && a.month===b.m)?'ok':'diff';
}
/* 指定年月，算出下一個批次碼：接在當月「已用過的最大字母」之後，
   不回頭補中間的空缺（空缺可能是已配發但未登錄，補用會撞號） */
function nextBatch(y,m){
  const yl=yearLetter(y), ml=monthLetter(m);
  if(!yl||!ml) return '';
  let max=-1;
  R.forEach(r=>{ const d=decodeSn(r.sn);
    if(d && d.core[0]===yl && d.core[1]===ml){
      const i=d.core.charCodeAt(2)-65;
      if(i>=0 && i<=25 && i>max) max=i;
    }});
  if(max>=25) return '';           /* A–Z 用完 */
  return yl+ml+String.fromCharCode(65+max+1);
}

/* 產品型號表 — 依「安德斯內視鏡產品型號樹狀圖 20260820」
   k: 'B'=批號（3 碼）、'S'=序號（批號 3 碼 + 流水 4 碼） */
const PRODUCTS=[
 {g:'人用醫療',f:'插管鏡 ESVBS 1',n:'插管鏡主機',m:'NEOMN-01',k:'S'},

 {g:'人用醫療',f:'喉鏡 LRG-01',n:'喉鏡影像管',m:'LRG400N-01',k:'S'},
 {g:'人用醫療',f:'輸尿管鏡 ESSFUS 1',n:'一次性軟式輸尿管鏡',m:'URS 700-01',k:'B'},

 {g:'人用醫療',f:'五官鏡 ESSA-01',n:'4mm 12cm 硬式鏡頭',m:'CR120400',k:'S'},
 {g:'人用醫療',f:'五官鏡 ESSA-01',n:'4mm 數位 10cm 軟式鏡頭',m:'CF100400',k:'S'},
 {g:'人用醫療',f:'五官鏡 ESSA-01',n:'2.2mm 數位軟式鏡頭',m:'CF200220',k:'S'},
 {g:'人用醫療',f:'五官鏡 ESSA-01',n:'1.65mm 超細數位硬式鏡頭',m:'CR200165',k:'S'},
 {g:'人用醫療',f:'五官鏡 ESSA-01',n:'鏡頭延長線',m:'CEXT-01',k:'S'},
 {g:'人用醫療',f:'閉鎖器 BBE',n:'一次性閉鎖器',m:'BBE-01',k:'B'},
 {g:'人用醫療',f:'閉鎖器 BBE',n:'閉鎖器轉接盒',m:'BBE UAB-01',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'便攜式主機',m:'VPD-01',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'4mm 耳鏡鏡頭',m:'VCR018400',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'4mm 12cm 硬式鏡頭',m:'VCR120400',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'4mm 數位 10cm 軟式鏡頭',m:'VCF100400',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'2.2mm 數位軟式鏡頭',m:'VCF200220',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'1.65mm 超細數位硬式鏡頭',m:'VCR200165',k:'S'},
 {g:'獸醫用',f:'五官鏡（獸醫）ESENT-01',n:'鏡頭延長線',m:'VCEXT-01',k:'S'},
 {g:'獸醫用',f:'2.2mm 獸醫 ESPV-01',n:'便攜式主機',m:'VPD-02',k:'S'},
 {g:'獸醫用',f:'2.2mm 獸醫 ESPV-01',n:'60cm 影像管',m:'IT6022-01',k:'S'},
 {g:'獸醫用',f:'3.0mm 獸醫 ESSTV-01',n:'3.0mm 工作通道內視鏡',m:'WCE30-01',k:'S'},
 {g:'獸醫用',f:'3.0mm 獸醫 ESSTV-01',n:'USB 轉接盒',m:'VURT-01',k:'S'}
];
const PIDX={}; PRODUCTS.forEach(p=>PIDX[p.m]=p);
function prodOf(model){ return PIDX[String(model||'').trim()]||null; }
/* 依產品與數量產生批號／序號 */
function genSn(model, qty){
  const p=prodOf(model); if(!p) return null;
  const d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  const b=nextBatch(y,m);
  if(!b) return null;
  const n=Math.max(1, Math.floor(Number(qty)||1));
  if(p.k==='B') return {batch:b, sn:b, kind:'批號'};
  if(n===1)     return {batch:b, sn:b+'0001', kind:'序號'};
  return {batch:b, sn:b+'0001-'+b+String(n).padStart(4,'0'), kind:'序號'};
}
function todayYMD(){
  const d=new Date(), p=n=>(n<10?'0':'')+n;
  return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}

<script>
/* ============================================================
   資料 / 畫面
   ============================================================ */
let R=[], META={updatedAt:'',updatedBy:''};
let Q='', FP='', FY='', FC='', FBAD=false;
let SORT={k:'no', dir:-1};

function normRec(r){
  r=r||{};
  return {no:(r.no===''||r.no===null||r.no===undefined)?'':r.no,
          date:String(r.date||''), product:String(r.product||''),
          qty:(r.qty===''||r.qty===null||r.qty===undefined)?'':r.qty,
          model:String(r.model||''),
          sn:String(r.sn||''), doer:String(r.doer||''), checker:String(r.checker||''),
          use:String(r.use||''), note:String(r.note||'')};
}
function nextNo(){
  let mx=0; R.forEach(r=>{ const n=parseInt(r.no,10); if(!isNaN(n)&&n>mx) mx=n; });
  return mx+1;
}
function view(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(d=>d.classList.toggle('on',d.id==='v-'+v));
  window.scrollTo(0,0);
}
function renderAll(){ vList(); vRule(); vData(); paintMe(); paintNet(); setHdr(); }
function setHdr(){
  $('#hdrSub').textContent = R.length ? '　共 '+R.length+' 筆'+(META.updatedAt?'　更新於 '+META.updatedAt:'') : '';
}

function filtered(){
  const q=Q.trim().toLowerCase();
  let out=R.filter(r=>{
    if(FP && r.product!==FP) return false;
    if(FC && r.checker!==FC) return false;
    if(FY){ const b=parseYM(r.date); if(!b || String(b.y)!==FY) return false; }
    if(FBAD && snMatch(r)!=='diff') return false;
    if(!q) return true;
    return [r.no,r.date,r.product,r.model,r.qty,r.sn,r.doer,r.checker,r.use,r.note]
      .join(' ').toLowerCase().indexOf(q)>=0;
  });
  const k=SORT.k, dir=SORT.dir;
  out.sort((a,b)=>{
    let x=a[k], y=b[k];
    if(k==='no'||k==='qty'){ x=parseFloat(x); y=parseFloat(y);
      if(isNaN(x)) x=-Infinity; if(isNaN(y)) y=-Infinity; }
    else { x=String(x); y=String(y); return dir*x.localeCompare(y,'zh-Hant'); }
    return dir*(x-y);
  });
  return out;
}

    '<td class="num mut">'+esc(r.no)+'</td>'+
    '<td class="mono">'+esc(fmtDate(r.date))+'</td>'+

    '<td>'+esc(r.checker)+'</td>'+

    '<td class="num">'+(ro?'':'<button class="btn sm" onclick="editRec('+i+')">編輯</button>')+'</td>'+

function fmtDate(d){
  const s=String(d||'').replace(/[^0-9]/g,'');
  if(String(d).indexOf('/')>=0) return d;
  if(s.length===8) return s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6,8);
  if(s.length===6) return s.slice(0,4)+'/'+s.slice(4,6);
  return String(d||'');
}

let GENPEND=null;
function genPreview(){
  const box=document.getElementById('g_prev'), ok=document.getElementById('g_ok');

  const model=(document.getElementById('g_model')||{}).value||'';
  const qty=parseInt((document.getElementById('g_qty')||{}).value,10);

  if(!model){ box.className='genbox'; box.textContent='選擇產品後，這裡會顯示要配發的批號／序號'; return; }
  if(!qty||qty<1){ box.className='genbox'; box.textContent='請填寫數量（至少 1）'; return; }
  const p=prodOf(model), g=genSn(model,qty);
  if(!g){ box.className='genbox'; box.textContent='無法產生：本月批次碼已用到 Z，請聯絡管理員'; return; }
  GENPEND={p:p,qty:qty,g:g};
  if(ok) ok.disabled=false;
  const d=decodeSn(g.batch);
  box.className='genbox on';
  box.innerHTML=
    '<div class="gencode">'+esc(g.sn)+'</div>'+

    '</div>';
}
async function saveGen(){
  if(!canWrite()) return denyWrite();
  if(!GENPEND) return toast('請先選擇產品與數量');
  const gv=id=>((document.getElementById(id)||{}).value||'').trim();
  const {p,qty,g}=GENPEND;
  const rec=normRec({no:nextNo(), date:todayYMD(), product:p.n, model:p.m, qty:qty,
    sn:g.sn, doer:'', checker:gv('g_checker'), use:gv('g_use'), note:gv('g_note')});

}

  '<div class="card"><h2>各月已用批次<span class="sub">依批號解析出的年月統計</span></h2>'+
    monthTableHTML()+
  '</div>';
  const rq=$('#rq'); if(rq) rq.oninput=()=>{
    const d=decodeSn(rq.value);
    $('#rqOut').innerHTML = (!d||d.year===null)
      ? (rq.value?'無法解析':'—')
      : '<b>'+esc(d.core)+'</b> → '+d.year+' 年 '+(d.month?d.month+' 月':'月碼無效')+
        '　第 '+esc(d.batch)+' 批'+(d.serial?'　序號 '+esc(d.serial):'')+
        (d.prefix?'　（前綴 '+esc(d.prefix)+'）':'')+
        '　共 '+R.filter(r=>{const x=decodeSn(r.sn);return x&&x.core===d.core;}).length+' 筆使用此批號';
  };
}
function calcNext(){
  const y=parseInt($('#ny').value,10), m=parseInt($('#nm').value,10);
  if(isNaN(y)||isNaN(m)||m<1||m>12) return toast('請輸入正確的年與月');
  const c=nextBatch(y,m);
  $('#nOut').innerHTML = c ? '下一個批號：<b>'+esc(c)+'</b>（完整序號例 '+esc(c)+'0001）'
                           : '這個年月的批次碼已用到 Z，或超出批號可表示範圍';
}
function monthTableHTML(){
  const g={};
  R.forEach(r=>{ const d=decodeSn(r.sn); if(!d||d.year===null||!d.month) return;
    const k=d.year+'-'+String(d.month).padStart(2,'0');
    (g[k]=g[k]||{})[d.batch]=((g[k]||{})[d.batch]||0)+1; });
  const keys=Object.keys(g).sort().reverse();
  if(!keys.length) return '<div class="empty">尚無資料</div>';
  return '<div class="tblwrap" style="max-height:340px"><table><thead><tr>'+
    '<th class="nos">年月</th><th class="nos">批號前 2 碼</th><th class="nos">已用批次</th>'+
    '<th class="nos num">批數</th><th class="nos num">紀錄筆數</th></tr></thead><tbody>'+
    keys.map(k=>{ const [y,m]=k.split('-').map(Number);
      const bs=Object.keys(g[k]).sort();
      const n=bs.reduce((s,b)=>s+g[k][b],0);
      return '<tr><td class="mono">'+y+'/'+String(m).padStart(2,'0')+'</td>'+
        '<td class="mono">'+(yearLetter(y)||'?')+(monthLetter(m)||'?')+'</td>'+
        '<td class="mono">'+bs.join(' ')+'</td>'+
        '<td class="num">'+bs.length+'</td><td class="num">'+n+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ---------- 資料管理頁 ---------- */
function vData(){
  const ro=CLOUD&&!canWrite();
  $('#v-data').innerHTML =
  '<div class="card"><h2>匯出</h2><div class="row">'+
    '<button class="btn" onclick="exportXlsx()">匯出 Excel（產品批序號記錄表）</button>'+
    '<span class="hint" style="margin:0">欄位與原本的 Excel 相同，可直接沿用。</span>'+
  '</div></div>'+
  '<div class="card"><h2>匯入 Excel<span class="sub">需有「項次／日期／產品名稱／批號」等欄位</span></h2>'+

    '<div class="row">'+
      '<button class="btn" onclick="pickImport(\'merge\')">合併匯入（依批號更新／新增）</button>'+
      '<button class="btn danger" onclick="pickImport(\'replace\')">整份取代</button>'+
    '</div>'+
    '<div class="hint">合併匯入：批號相同的更新內容，沒有的新增在後面。整份取代：雲端資料全部換成檔案內容。</div>')+
  '</div>'+
  '<div class="card"><h2>目前狀態</h2>'+
    '<div class="hint" style="font-size:13px">'+
      '紀錄筆數：<b>'+R.length+'</b><br>'+
      '雲端版本：<b>'+REV+'</b><br>'+
      '最後更新：<b>'+esc(META.updatedAt||'—')+'</b>'+(META.updatedBy?'　由 <b>'+esc(META.updatedBy)+'</b>':'')+'<br>'+
      '資料表：Google 試算表的「產品批序號」工作表'+
    '</div>'+
  '</div>';
}
function xlsxRows(){
  return R.map(r=>({'項次':r.no,'日期':r.date,'產品名稱':r.product,'數量':r.qty,
    '批號/序號':r.sn,'執行者':r.doer,'確認者':r.checker,'用途':r.use,'備註1':r.note,
    '型號':r.model}));
}
function exportXlsx(){
  const ws=XLSX.utils.json_to_sheet(xlsxRows(),
    {header:['項次','日期','產品名稱','數量','批號/序號','執行者','確認者','用途','備註1','型號']});
  ws['!cols']=[{wch:6},{wch:11},{wch:22},{wch:7},{wch:26},{wch:9},{wch:9},{wch:24},{wch:34},{wch:13}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'產品批序號記錄表');
  const d=new Date(), p=n=>(n<10?'0':'')+n;
  XLSX.writeFile(wb,'產品批序號'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.xlsx');
}
let IMPMODE='merge';
function pickImport(mode){
  if(!canWrite()) return denyWrite();
  IMPMODE=mode;
  let el=document.getElementById('__imp');
  if(!el){ el=document.createElement('input'); el.type='file'; el.id='__imp'; el.accept='.xlsx,.xls';
    el.onchange=()=>{ if(el.files[0]) doImport(el.files[0]); el.value=''; };
    document.body.appendChild(el); }
  el.click();
}
async function doImport(file){
  let wb;
  try{ wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); }
  catch(e){ return toast('檔案讀取失敗'); }
  const sn=wb.SheetNames.find(n=>n.indexOf('批序號')>=0)||wb.SheetNames[0];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  let hr=aoa.findIndex(r=>r&&r.some(c=>String(c||'').trim()==='批號/序號'||String(c||'').trim()==='批號'));
  if(hr<0) return toast('找不到「批號/序號」欄位');
  const H=aoa[hr].map(c=>String(c===null||c===undefined?'':c).trim());
  const col=names=>{ for(const n of names){ const i=H.indexOf(n); if(i>=0) return i; } return -1; };
  const C={no:col(['項次']),date:col(['日期']),product:col(['產品名稱','產品']),qty:col(['數量']),
    sn:col(['批號/序號','批號']),doer:col(['執行者']),checker:col(['確認者']),
    use:col(['用途']),note:col(['備註1','備註']),model:col(['型號'])};
  const S_=v=>{ if(v===null||v===undefined) return '';
    if(v instanceof Date){ const p=n=>(n<10?'0':'')+n;
      return v.getFullYear()+'/'+p(v.getMonth()+1)+'/'+p(v.getDate()); }
    if(typeof v==='number' && Math.round(v)===v) return String(v);
    return String(v).trim(); };
  const list=[];
  for(let i=hr+1;i<aoa.length;i++){
    const r=aoa[i]||[]; const g=k=>C[k]>=0?r[C[k]]:null;
    const code=S_(g('sn')); if(!code) continue;
    list.push(normRec({no:S_(g('no')),date:S_(g('date')),product:S_(g('product')),qty:S_(g('qty')),
      sn:code,doer:S_(g('doer')),checker:S_(g('checker')),use:S_(g('use')),note:S_(g('note')),
      model:S_(g('model'))}));
  }
  if(!list.length) return toast('檔案裡沒有可匯入的資料');
  const backup=JSON.parse(JSON.stringify(R));
  let add=0,upd=0;
  if(IMPMODE==='replace'){ R=list; add=list.length; }
  else{
    list.forEach(n=>{ const ix=R.findIndex(o=>o.sn===n.sn && o.product===n.product);
      if(ix>=0){ R[ix]=n; upd++; } else { R.push(n); add++; } });
  }
  if(await push()){ renderAll();
    toast(IMPMODE==='replace'?('已取代為 '+add+' 筆'):('匯入完成：新增 '+add+'、更新 '+upd)); }
  else { R=backup; renderAll(); }
}
async function seedCloud(){
  if(!canWrite()) return denyWrite();
  if(R.length) return toast('雲端已有資料，請改用「資料管理 → 匯入」');
  R=SEED.map(normRec);
  if(await push()){ renderAll(); toast('已寫入 '+R.length+' 筆到雲端'); }
  else { R=[]; renderAll(); }
}

(async function init(){
  if(CLOUD){
    try{
      const c=await DB.get('cache');
      if(c&&c.R){ R=c.R.map(normRec); REV=c.REV||0; META=c.META||META; renderAll(); setNet('load'); }
    }catch(e){}
    if(!TOKEN && !PW){ renderAll(); openGate('login'); return; }
    if(await whoAmI()) await pull();
    renderAll();
    return;
  }
  ME={name:'本機使用者', role:'admin', roleName:'管理員'};
  try{
    const c=await DB.get('cache');
    R = (c&&c.R&&c.R.length) ? c.R.map(normRec) : SEED.map(normRec);
    REV=(c&&c.REV)||0; META=(c&&c.META)||META;
  }catch(e){ R=SEED.map(normRec); }
  setNet('local'); renderAll();
})();
