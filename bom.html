<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOM 管理系統 — 安德斯醫學科技</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --line2:#eef0f3;
  --txt:#1c2128; --mut:#6b7480; --acc:#1f6feb; --acc-bg:#e8f0fe;
  --ok:#1a7f4b; --ok-bg:#e6f5ec; --warn:#a8630a; --warn-bg:#fdf3e3;
  --bad:#c0392b; --bad-bg:#fdecea; --radius:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
h1 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 13px;border-radius:6px;cursor:pointer;
  font-size:13.5px;color:var(--mut);font-family:inherit}
nav button:hover{background:var(--line2);color:var(--txt)}
nav button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
main{padding:18px;max-width:1600px;margin:0 auto}
.view{display:none} .view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card>h2{font-size:14px;margin:0 0 12px;font-weight:650}
.card>h2 .sub{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:180px}
input,select,textarea,button{font-family:inherit;font-size:13.5px}
input[type=text],input[type=number],input[type=search],select,textarea{
  padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
.btn{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:#f0c3bd}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:11.5px;color:var(--mut);letter-spacing:.5px}
.stat .v{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:#fafbfc;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:2;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th.nos{cursor:default}
th .ar{color:var(--acc);font-size:10px}
td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.mut{color:var(--mut)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--acc-bg);color:var(--acc)}
.tag.gray{background:var(--line2);color:var(--mut)}
tr.lack td{background:#fef7f6}
/* BOM 黑框格線 */
table.grid{border-collapse:separate;border-spacing:0}
table.grid th,table.grid td{border-right:1px solid #000;border-bottom:1px solid #000;padding:6px 9px}
table.grid th{border-top:1px solid #000;background:#f0f2f5;color:#000}
table.grid th:first-child,table.grid td:first-child{border-left:1px solid #000}
table.grid tbody tr:hover td{background:#f4f8ff}
table.grid tr.lack td{background:#fdeceb}
.no{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
table.grid td.lv1{background:#eef2f7}

.lvl{display:inline-block}
.tw{cursor:pointer;user-select:none;color:var(--mut);width:14px;display:inline-block}
.empty{padding:40px;text-align:center;color:var(--mut)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--mut);background:#fff}
.drop.over{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(1100px,94vw);width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(20,24,30,.42)}
.dlg-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dlg-h b{font-size:14.5px;flex:1}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:12.5px;background:#fff}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.6}
.dgroup{margin-bottom:16px}
.dgroup>h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.ac{position:relative}
.aclist{position:absolute;z-index:30;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);
  border-radius:6px;max-height:250px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.aclist div{padding:6px 10px;cursor:pointer;font-size:12.5px}
.aclist div:hover,.aclist div.sel{background:var(--acc-bg)}
.del{background:#fdecea;color:var(--bad);text-decoration:line-through}
.add{background:#e6f5ec;color:var(--ok)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2128;color:#fff;
  padding:10px 18px;border-radius:7px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.on{opacity:1}
.mini{font-size:12px;color:var(--mut)}
input[type=file]{display:none}

/* ---------- 登入畫面 ---------- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;
  overflow:auto;padding:40px 16px}
#gate.on{display:block}
.gate-box{max-width:430px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:26px 26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-box h2{margin:0 0 4px;font-size:19px}
.gate-box .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.gate-tabs{display:flex;gap:2px;background:var(--line2);padding:3px;border-radius:8px;margin-bottom:18px}
.gate-tabs button{flex:1;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;
  font-size:13.5px;color:var(--mut);font-family:inherit}
.gate-tabs button.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gate-msg{font-size:13px;padding:9px 11px;border-radius:7px;margin-bottom:14px;line-height:1.6}
.gate-msg.bad{background:#fdecec;color:#a62222;border:1px solid #f3c6c6}
.gate-msg.ok{background:#e9f7ee;color:#1a6b38;border:1px solid #bfe3cd}
.gate-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mut);line-height:1.7}
.gate-foot a{color:var(--acc);cursor:pointer;text-decoration:underline}
#meBox{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);
  white-space:nowrap;margin-left:auto}
#meBox b{color:var(--txt)}
.ro-banner{background:#fff8e6;border:1px solid #f0dca8;color:#8a6414;
  padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.6}
#moveBadge:not(:empty){display:inline-block;margin-left:5px;background:var(--acc);color:#fff;
  border-radius:99px;padding:0 6px;font-size:11px;font-weight:600;line-height:16px}
.mv-in{color:var(--ok);font-weight:600}
.mv-out{color:var(--bad);font-weight:600}
/* 回系統入口 */
.homelink{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mut);
  font-size:12.5px;padding:4px 10px 4px 5px;border:1px solid var(--line);border-radius:99px;
  white-space:nowrap;transition:.15s}
.homelink:hover{background:var(--line2);color:var(--txt);border-color:#cfd5db}
.homelink img{height:20px;width:auto;display:block}
.navlink{display:inline-flex;align-items:center;padding:7px 13px;border-radius:6px;
  font-size:13.5px;color:var(--mut);text-decoration:none;white-space:nowrap}
.navlink:hover{background:var(--line2);color:var(--txt)}
</style>
</head>

   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzjpoGstBAAPfVpHwQ2dfCMtDw3yfVgtYQuLKbUWFO8sGNRu7Pkk8wOaqZguGkQx7PQxg/exec';

<script>
/* ============================================================
   BOM 管理系統 — 單檔版
   儲存：IndexedDB (bomdb / kv / "state")
   ============================================================ */
const SEED = {"items":[],"boms":[],"history":[],"meta":{},"settings":{"costMode":"max"}};

/* ---------- IndexedDB 極簡 KV ---------- */
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('bomdb',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv',mode), s=t.objectStore('kv'), rq=fn(s);
    t.oncomplete=()=>res(rq?rq.result:undefined); t.onerror=()=>rej(t.error);}));
  return {get:k=>run('readonly',s=>s.get(k)), set:(k,v)=>run('readwrite',s=>s.put(v,k))};})();

/* ---------- 全域狀態 ---------- */
let S={items:[],boms:[],history:[],meta:{},settings:{purchaseStop:true}};
const SET=()=>(S.settings||(S.settings={purchaseStop:true}));
let IDX={}, BIDX={};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const money=n=>n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});

function reindex(){IDX={};S.items.forEach(i=>IDX[i.code]=i);
                   BIDX={};S.boms.forEach(b=>BIDX[b.code]=b);
                   if(typeof rebuildVBom==='function') rebuildVBom();}

const itemOf=c=>IDX[c]||{code:c,name:'（未建檔）',spec:'',unit:'',stock:0,cost:null,supplier:'',note:'',_ghost:1};

/* ---------- BOM 樹狀結構 ---------- */
function buildTree(bom){
  const root={children:[]}, stack=[{lv:0,node:root}];
  (bom.lines||[]).forEach((l,i)=>{
    const lv=Math.max(1,+l.level||1);
    while(stack.length>1 && stack[stack.length-1].lv>=lv) stack.pop();
    const node={...l,level:lv,_i:i,children:[]};
    stack[stack.length-1].node.children.push(node);
    stack.push({lv,node});
  });
  return root.children;
}
/* 由平面明細算出階層編號：1 / 1.1 / 1.1.1 ... */
function lineNos(lines){
  const c=[], out=[];
  (lines||[]).forEach(l=>{
    const lv=Math.max(1,+l.level||1);
    c.length=lv;
    for(let i=0;i<lv-1;i++) if(!c[i]) c[i]=1;
    c[lv-1]=(c[lv-1]||0)+1;
    out.push(c.slice(0,lv).join('.'));
  });
  return out;
}
/* 下階來源：BOM 內嵌階層優先，否則引用同名獨立子 BOM
   structural=true 時僅回傳結構下階（供樹狀顯示）；
   否則套用「採購點規則」：本身已有單位成本的組件視為外購件，不再往下展開。 */
/* 成本規則：
   buy = 自身單價優先（有價就不再展開下階）
   sum = 一律下階加總（只有沒下階時才用自身單價）
   max = 取「自身單價」與「下階加總」較高者，避免少算（預設） */
function costMode(){
  const st=SET();
  if(st.costMode) return st.costMode;
  return st.purchaseStop===false ? 'sum' : 'max';
}
function isBuyPoint(code){
  const it=IDX[code];
  return !!(costMode()!=='sum' && it && it.cost!=null && it.cost!=='' && !isNaN(it.cost));
}
function rawKids(node,path){
  if(node.children&&node.children.length) return {kids:node.children,ref:false};
  const sub=BIDX[node.code];
  if(sub && !path.includes(node.code)) return {kids:buildTree(sub),ref:true};
  return {kids:[],ref:false};
}
function kidsOf(node,path,structural){
  const r=rawKids(node,path);
  if(structural || !r.kids.length) return r;
  if(!isBuyPoint(node.code)) return r;
  if(costMode()==='buy') return {kids:[],ref:false,buy:true};
  /* max：比較自身單價與下階加總，取高者 */
  const own=(IDX[node.code].cost||0);
  const sub=r.kids.reduce((s,k)=>s+subtreeUnit(k,path.concat(node.code)),0);
  return own>=sub ? {kids:[],ref:false,buy:true} : r;
}
/* 子樹單位成本（該節點 qty 個）— 供 max 比較用，不套用 max 規則以免無窮遞迴 */
function subtreeUnit(node,path){
  const r=rawKids(node,path);
  const own=IDX[node.code]&&IDX[node.code].cost!=null?IDX[node.code].cost:null;
  if(!r.kids.length) return (own||0)*(+node.qty||0);
  const sub=r.kids.reduce((s,k)=>s+subtreeUnit(k,path.concat(node.code)),0)*(+node.qty||0);
  if(costMode()==='sum') return sub;
  return Math.max(own!=null?own*(+node.qty||0):0, sub);
}
/* 找出「自身單價 < 下階加總」的組件，提醒使用者確認 */
function costConflicts(){
  const out=[];
  S.boms.forEach(b=>{
    (function walk(nodes,path){
      nodes.forEach(n=>{
        const r=rawKids(n,path); if(!r.kids.length) return;
        const it=IDX[n.code];
        if(it && it.cost!=null && it.cost!==''){
          const sub=r.kids.reduce((s,k)=>s+subtreeUnit(k,path.concat(n.code)),0)/(+n.qty||1);
          if(sub>it.cost+0.01)
            out.push({code:n.code,name:it.name,own:it.cost,sub:sub,bom:b.code});
        }
        walk(r.kids,path.concat(n.code));
      });
    })(buildTree(b),[b.code]);
  });
  const seen={};
  return out.filter(x=>{const k=x.code; if(seen[k])return false; seen[k]=1; return true;});
}
/* 展開 BOM：leaf=葉料號總需求, sub=半成品需求, cycles=循環引用 */
/* ============================================================
   虛擬子 BOM
   有些組件（例 F01-ORL0001 掛在 F01-ORL0101 底下）在 BOM 明細裡本來就有下階，
   但還沒被拆成獨立 BOM，所以不在「BOM主檔」裡。這裡把它們也組成可展開的 BOM，
   讓需求試算能直接選到「任何有下階的料號」。
   ============================================================ */
let VBOM={};
function rebuildVBom(){
  VBOM={};
  if(typeof buildTree!=='function' || typeof flattenSub!=='function') return;
  (S.boms||[]).forEach(b=>{
    (function walk(nodes){
      nodes.forEach(n=>{
        if(n.children && n.children.length){
          if(!BIDX[n.code] && !VBOM[n.code]){
            const lines=flattenSub(n);
            if(lines.length) VBOM[n.code]={
              id:n.code, code:n.code,
              name:n.name||(IDX[n.code]&&IDX[n.code].name)||'',
              spec:n.spec||(IDX[n.code]&&IDX[n.code].spec)||'',
              source:'掛在 '+b.code+' 底下', note:'', lines:lines,
              _virtual:true, _from:b.code };
          }
          walk(n.children);
        }
      });
    })(buildTree(b));
  });
}
/* 取得可展開的 BOM：先找獨立 BOM，沒有就找虛擬子 BOM */
function bomOf(code){ return BIDX[code] || VBOM[code] || null; }
/* 需求試算可選的產品清單＝獨立 BOM ＋ 有下階但未建 BOM 的組件 */
function mrpProducts(){
  const a=(S.boms||[]).map(b=>({code:b.code,name:b.name||'',virtual:false}));
  const bs=Object.keys(VBOM).map(c=>({code:c,name:VBOM[c].name,virtual:true,from:VBOM[c]._from}));
  bs.sort((x,y)=>x.code<y.code?-1:1);
  return a.concat(bs);
}

function explode(bomCode,orderQty,opt){
  opt=opt||{};
  const bom=bomOf(bomCode); if(!bom) return null;
  const leaf={}, sub=[], cycles=[], pool={};
  const avail=c=>{
    if(!(c in pool)) pool[c]=(itemOf(c).stock||0)-(opt.keepSafety?(itemOf(c).safety||0):0);
    return Math.max(0,pool[c]);
  };
  (function walk(nodes,mult,path,depth){
    nodes.forEach(n=>{
      const qty=(+n.qty||0)*mult;
      if(qty<=0) return;
      if(path.includes(n.code)){cycles.push(path.concat(n.code).join(' → '));return;}
      const {kids,ref}=kidsOf(n,path);
      if(kids.length){
        let need=qty, used=0;
        if(opt.netting){const a=avail(n.code);used=Math.min(a,qty);pool[n.code]-=used;need=qty-used;}
        sub.push({code:n.code,name:n.name||itemOf(n.code).name,unit:n.unit||itemOf(n.code).unit,
                  gross:qty,fromStock:used,net:need,depth,ref});
        if(need>0) walk(kids,need,path.concat(n.code),depth+1);
      }else{
        leaf[n.code]=(leaf[n.code]||0)+qty;
      }
    });
  })(buildTree(bom),orderQty,[bomCode],1);
  return {leaf,sub,cycles};
}
/* 節點小計：此節點「n.qty 個」的材料成本。
   若該節點自己沒有單價（非外購件），就用下階加總，避免成本少算。 */
function nodeCost(node,path){
  const p=path||[];
  const {kids}=kidsOf(node,p);
  if(!kids.length) return (itemOf(node.code).cost||0)*(+node.qty||0);
  const per=kids.reduce((s,k)=>s+nodeCost(k,p.concat(node.code)),0);  // 每 1 個父件
  return per*(+node.qty||0);
}
/* 該品號是否有自己的單價（用來標示成本是加總來的還是自己的） */
function hasOwnCost(code){
  const it=IDX[code];
  return !!(it && it.cost!=null && it.cost!=='' && !isNaN(it.cost));
}
/* 單台材料成本 = 展開後葉料號 Σ(用量 × 單價) */
function bomCost(bom){
  const ex=explode(bom.code,1,{});
  if(!ex) return {cost:0,missing:0};
  let cost=0,missing=0;
  Object.entries(ex.leaf).forEach(([c,q])=>{
    const u=itemOf(c).cost;
    if(u==null||u===''){missing++;} else cost+=u*q;
  });
  return {cost,missing,leafN:Object.keys(ex.leaf).length};
}
/* 反查：料號被哪些 BOM 使用 */
function whereUsed(code){
  const out=[];
  S.boms.forEach(b=>{
    const ex=explode(b.code,1,{}); if(!ex) return;
    if(ex.leaf[code]!=null) out.push({bom:b,qty:ex.leaf[code],role:'葉料號'});
    else{const s=ex.sub.find(x=>x.code===code); if(s) out.push({bom:b,qty:s.gross,role:'半成品'});}
  });
  return out;
}

  if(an&&bn) return 0; if(an) return 1; if(bn) return -1;
  if(typeof a==='number'&&typeof b==='number') return (a-b)*dir;
  return String(a).localeCompare(String(b),'zh-Hant')*dir;
}

<script>
/* ============================================================
   雲端同步層（Google Sheets + Apps Script）
   ============================================================ */
/* PWKEY 用 v2：讓舊版存在瀏覽器裡的共用密碼失效，改版後一律先看到登入畫面 */
const TKKEY='bom_token_v1', PWKEY='bom_pw_v2', WHOKEY='bom_who_v1';
const LS={get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},
          set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},
          del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
let TOKEN = LS.get(TKKEY);          // 個人帳號登入憑證
let PW = LS.get(PWKEY);             // 過渡期共用密碼（唯讀）
let WHO = LS.get(WHOKEY);
let ME = null;                      // {name,email,role,roleName,legacy}
let REV = 0, NET = 'idle', LASTSYNC = '', DIRTY = false, SAVING = false;

/* 權限 */
const ROLE_NAME = {admin:'管理員', editor:'編輯', viewer:'唯讀'};
function myRole(){ return (ME && ME.role) || 'viewer'; }
function canWrite(){ return !CLOUD || myRole()==='admin' || myRole()==='editor'; }
function isAdmin(){ return CLOUD && myRole()==='admin'; }
function denyWrite(){
  toast(ME && ME.legacy
    ? '共用密碼為唯讀模式，請註冊個人帳號後由管理員給予編輯權限'
    : '你的權限為「唯讀」，無法修改資料。請聯絡管理員調整權限');
}

function setNet(s){ NET=s; paintNet(); }
function paintNet(){
  const el=document.getElementById('netBox'); if(!el) return;
  const map={idle:['','gray'],load:['讀取雲端中…','info'],ok:['已同步','ok'],
    save:['儲存中…','info'],err:['雲端連線失敗','bad'],conflict:['版本衝突','warn'],local:['本機模式','gray']};
  const [t,c]=map[NET]||['',''];
  el.innerHTML = CLOUD
    ? `<span class="tag ${c}">${t}${NET==='ok'&&LASTSYNC?' '+LASTSYNC.slice(-8):''}</span>
       <button class="btn sm" onclick="pullNow()" title="重新讀取雲端資料">↻</button>`
    : `<span class="tag gray">本機模式</span>`;
}
async function apiPost(action,payload,extra){
  const body=Object.assign({action:action,payload:payload,token:TOKEN,pw:PW,who:WHO},extra||{});
  let lastErr;
  /* 只有讀取才自動重試；寫入若重試，可能第一次其實已成功而造成假性版本衝突 */
  const tries = (action==='save') ? 1 : 2;
  for(let i=0;i<tries;i++){
    try{
      const res=await fetch(API_URL,{method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){ lastErr=e; if(i+1<tries) await new Promise(r=>setTimeout(r,1200)); }
  }
  throw lastErr;
}
/* 讀取雲端 → 覆蓋本地 */
async function pull(silent){
  if(!CLOUD) return false;
  setNet('load');
  try{
    const d=await apiPost('load',null);
    if(d.error){
      setNet('err');
      if(d.needLogin){ openGate('login', d.error); return false; }
      if(!silent) dialog('讀取雲端失敗',`<p>${esc(d.error)}</p>
        <div class="hint">畫面顯示的是本機快取資料，按上方 ↻ 可重試。</div>`);
      return false;
    }
    if(d.auth){ ME=d.auth; ME.roleName=ME.roleName||ROLE_NAME[ME.role]||'唯讀';
                WHO=ME.name||WHO; closeGate(); }
    S={items:d.items||[],boms:d.boms||[],history:d.history||[],moves:d.moves||[],staff:d.staff||[],
       settings:d.settings||{purchaseStop:true},
       meta:{updatedAt:d.updatedAt||'',updatedBy:d.updatedBy||''}};
    REV=d.rev||0; LASTSYNC=d.updatedAt||''; DIRTY=false;
    reindex(); await DB.set('cache',JSON.parse(JSON.stringify({S:S,REV:REV})));
    setNet('ok'); return true;
  }catch(e){ setNet('err');
    if(!silent) toast('連不上雲端（'+(e.message||'網路逾時')+'），顯示的是本機快取。可按 ↻ 重試');
    return false; }
}
async function pullNow(){ if(await pull()) { renderAll(); toast('已重新讀取雲端資料'); } }
/* 寫回雲端 */
async function push(force){
  if(!CLOUD){ await DB.set('state',JSON.parse(JSON.stringify(S))); return true; }
  if(!canWrite()){ denyWrite(); return false; }
  if(SAVING) { DIRTY=true; return false; }
  /* 送出前先確認資料合理，避免把雲端寫空 */
  if(!S.items || !S.items.length){
    setNet('err');
    dialog('已阻止寫入雲端',
      `<p>目前記憶體中沒有任何料號，若寫回雲端會清空所有人的資料，因此已擋下。</p>
       <div class="hint">請按 ↻ 重新讀取雲端，或到「資料管理」上傳資料庫 Excel。</div>`);
    return false;
  }
  SAVING=true; setNet('save');
  /* 每次成功寫入前，先把上一版留在本機，萬一出事可還原 */
  try{ await DB.set('lastGood',JSON.parse(JSON.stringify({S:S,REV:REV,ts:nowts()}))); }catch(e){}
  try{
    const d=await apiPost('save',S,{baseRev:force?null:REV,force:!!force});
    if(d.conflict){
      setNet('conflict'); SAVING=false;
      dialog('雲端資料已被別人更新',`
        <p>你載入資料後，<b>${esc(d.updatedBy||'其他使用者')}</b> 在
           <b>${esc(d.updatedAt||'')}</b> 也存過一次（雲端版本 ${d.serverRev}，你的是 ${REV}）。</p>
        <div class="hint">為避免蓋掉對方的修改，請選擇處理方式。建議先「放棄我的修改並重新載入」，
          確認雲端目前的內容；若你的修改其實已經存進去了，重新載入後就會看到。</div>`,
        `<button class="btn danger" type="button" onclick="closeDlg();push(true)">強制覆蓋雲端</button>
         <button class="btn pri" type="button" onclick="closeDlg();pullNow()">放棄我的修改並重新載入</button>
         <button class="btn" value="x">稍後再說</button>`);
      return false;
    }
    if(d.error){
      setNet('err'); SAVING=false;
      if(d.needLogin){ openGate('login', d.error); return false; }
      if(d.denied){ dialog('無法儲存',`<p>${esc(d.error)}</p>
        <div class="hint">你在畫面上的修改沒有寫進雲端。重新整理後會回到雲端目前的資料。</div>`); return false; }
      toast('儲存失敗：'+d.error); return false;
    }
    REV=d.rev; LASTSYNC=d.updatedAt||''; DIRTY=false;
    S.meta.updatedAt=LASTSYNC; S.meta.updatedBy=WHO;
    await DB.set('cache',JSON.parse(JSON.stringify({S:S,REV:REV})));
    setNet('ok'); SAVING=false;
    if(DIRTY){ DIRTY=false; return push(); }
    return true;
  }catch(e){ setNet('err'); SAVING=false; toast('無法連線到雲端，資料僅存在本機'); 
    await DB.set('cache',JSON.parse(JSON.stringify({S:S,REV:REV}))); return false; }
}
/* ============================================================
   登入 / 註冊
   ============================================================ */
let GATE_TAB='login', GATE_MSG='', GATE_MSG_OK=false, GATE_BUSY=false;

function openGate(tab,msg,ok){
  GATE_TAB = tab||'login'; GATE_MSG = msg||''; GATE_MSG_OK = !!ok;
  document.getElementById('gate').classList.add('on');
  paintGate();
}
function closeGate(){
  document.getElementById('gate').classList.remove('on');
  GATE_MSG=''; GATE_BUSY=false;
}
function gateTab(t){ GATE_TAB=t; GATE_MSG=''; paintGate(); }

function paintGate(){
  const msg = GATE_MSG
    ? `<div class="gate-msg ${GATE_MSG_OK?'ok':'bad'}">${esc(GATE_MSG)}</div>` : '';
  const tabs = `<div class="gate-tabs">
    <button type="button" class="${GATE_TAB==='login'?'on':''}"  onclick="gateTab('login')">登入</button>
    <button type="button" class="${GATE_TAB==='reg'?'on':''}"    onclick="gateTab('reg')">申請帳號</button>
    <button type="button" class="${GATE_TAB==='legacy'?'on':''}" onclick="gateTab('legacy')">共用密碼</button>
  </div>`;
  let body;
  if(GATE_TAB==='login'){
    body = `${tabs}${msg}
      <div class="fld"><label>Email</label>
        <input id="g_email" type="email" value="${esc(LS.get('bom_last_email'))}" placeholder="you@company.com"></div>
      <div class="fld"><label>密碼</label>
        <input id="g_pw" type="password" placeholder="請輸入密碼"></div>
      <button class="btn pri" type="button" style="width:100%;margin-top:6px"
        onclick="doLogin()"${GATE_BUSY?' disabled':''}>${GATE_BUSY?'登入中…':'登入'}</button>
      <div class="gate-foot">還沒有帳號？請按上方「申請帳號」，填完就能直接使用。</div>`;
  }else if(GATE_TAB==='reg'){
    body = `${tabs}${msg}
      <div class="fld"><label>姓名（會記在異動紀錄）</label>
        <input id="r_name" placeholder="例：謝嘉元"></div>
      <div class="fld"><label>Email（登入帳號）</label>
        <input id="r_email" type="email" placeholder="you@company.com"></div>
      <div class="fld"><label>密碼（至少 6 個字元）</label>
        <input id="r_pw" type="password"></div>
      <div class="fld"><label>確認密碼</label>
        <input id="r_pw2" type="password"></div>
      <button class="btn pri" type="button" style="width:100%;margin-top:6px"
        onclick="doRegister()"${GATE_BUSY?' disabled':''}>${GATE_BUSY?'建立中…':'建立帳號並登入'}</button>
      <div class="gate-foot">建立後立即可以使用，預設權限為<b>編輯</b>（可修改料號與 BOM）。
        管理員可隨時在「使用者管理」頁調整每個帳號的權限。</div>`;
  }else{
    body = `${tabs}${msg}
      <div class="gate-msg" style="background:var(--line2);color:var(--mut);border:1px solid var(--line)">
        過渡期用的舊共用密碼，登入後<b>只能查看、不能修改</b>資料。建議改用個人帳號。</div>
      <div class="fld"><label>你的名字</label>
        <input id="l_who" value="${esc(WHO)}" placeholder="例：謝嘉元"></div>
      <div class="fld"><label>共用密碼</label>
        <input id="l_pw" type="password" value="${esc(PW)}" placeholder="請向管理者索取"></div>
      <button class="btn" type="button" style="width:100%;margin-top:6px"
        onclick="doLegacy()">以唯讀身分進入</button>
      <div class="gate-foot">密碼只存在這台電腦的瀏覽器。管理員可在後端把
        <code>LEGACY_PW_ENABLED</code> 改成 <code>false</code> 停用此入口。</div>`;
  }
  document.getElementById('gateBox').innerHTML =
    `<h2>BOM 管理系統</h2><div class="sub">安德斯醫學科技　料號庫存 · BOM · 缺料試算</div>${body}<div class="gate-foot" style="margin-top:12px"><a href="index.html">← 回系統入口</a></div>`;
  const box = document.getElementById('gateBox');
  const first = box.querySelector('input:not([value]), input');
  setTimeout(()=>{ const t=box.querySelector('#g_pw,#r_name,#l_pw'); (t||first)?.focus(); },60);
  box.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      if(GATE_TAB==='login') doLogin(); else if(GATE_TAB==='reg') doRegister(); else doLegacy(); }
  });
}

async function doLogin(){
  if(GATE_BUSY) return;
  const email=document.getElementById('g_email').value.trim();
  const pw=document.getElementById('g_pw').value;
  if(!email||!pw){ GATE_MSG='請輸入 Email 與密碼'; GATE_MSG_OK=false; return paintGate(); }
  GATE_BUSY=true; paintGate();
  try{
    const d=await apiPost('login',null,{email:email,password:pw,token:'',pw:''});
    GATE_BUSY=false;
    if(d.error){ GATE_MSG=d.error; GATE_MSG_OK=false; return paintGate(); }
    TOKEN=d.token; ME=d.profile; ME.roleName=ME.roleName||ROLE_NAME[ME.role]||'唯讀';
    WHO=ME.name; PW='';
    LS.set(TKKEY,TOKEN); LS.set(WHOKEY,WHO); LS.set('bom_last_email',email); LS.del(PWKEY);
    closeGate();
    if(await pull()) renderAll(); else renderAll();
    toast('已登入：'+ME.name+'（'+ME.roleName+'）');
  }catch(e){ GATE_BUSY=false; GATE_MSG='連不上伺服器：'+(e.message||'網路逾時'); GATE_MSG_OK=false; paintGate(); }
}

async function doRegister(){
  if(GATE_BUSY) return;
  const name=document.getElementById('r_name').value.trim();
  const email=document.getElementById('r_email').value.trim();
  const pw=document.getElementById('r_pw').value, pw2=document.getElementById('r_pw2').value;
  if(!name||!email||!pw){ GATE_MSG='姓名、Email 與密碼皆為必填'; GATE_MSG_OK=false; return paintGate(); }
  if(pw.length<6){ GATE_MSG='密碼至少 6 個字元'; GATE_MSG_OK=false; return paintGate(); }
  if(pw!==pw2){ GATE_MSG='兩次輸入的密碼不一致'; GATE_MSG_OK=false; return paintGate(); }
  GATE_BUSY=true; paintGate();
  try{
    const d=await apiPost('register',null,{name:name,email:email,password:pw,token:'',pw:''});
    GATE_BUSY=false;
    if(d.error){ GATE_MSG=d.error; GATE_MSG_OK=false; return paintGate(); }
    if(d.token){   /* 註冊完成 → 直接登入 */
      TOKEN=d.token; ME=d.profile; ME.roleName=ME.roleName||ROLE_NAME[ME.role]||'唯讀';
      WHO=ME.name; PW='';
      LS.set(TKKEY,TOKEN); LS.set(WHOKEY,WHO); LS.set('bom_last_email',email); LS.del(PWKEY);
      closeGate(); if(await pull()) renderAll(); else renderAll();
      return toast('帳號已建立：'+ME.name+'（'+ME.roleName+'）');
    }
    LS.set('bom_last_email',email);
    GATE_TAB='login'; GATE_MSG=d.message||'帳號已建立，請登入'; GATE_MSG_OK=true; paintGate();
  }catch(e){ GATE_BUSY=false; GATE_MSG='連不上伺服器：'+(e.message||'網路逾時'); GATE_MSG_OK=false; paintGate(); }
}

async function doLegacy(){
  WHO=document.getElementById('l_who').value.trim();
  PW=document.getElementById('l_pw').value;
  if(!PW){ GATE_MSG='請輸入共用密碼'; GATE_MSG_OK=false; return paintGate(); }
  TOKEN=''; LS.del(TKKEY); LS.set(PWKEY,PW); LS.set(WHOKEY,WHO);
  closeGate();
  if(await pull()){ renderAll(); toast('已以唯讀身分進入'); }
}

function logout(){
  LS.del(TKKEY); LS.del(PWKEY);
  TOKEN=''; PW=''; ME=null;
  location.reload();
}

/* 修改自己的密碼 */
function changeMyPw(){
  if(!ME || ME.legacy) return toast('共用密碼模式無法修改密碼，請先註冊個人帳號');
  dialog('變更密碼',`
    <div class="fld"><label>目前密碼</label><input id="cp_old" type="password"></div>
    <div class="fld"><label>新密碼（至少 6 個字元）</label><input id="cp_new" type="password"></div>
    <div class="fld"><label>確認新密碼</label><input id="cp_new2" type="password"></div>`,
    `<button class="btn pri" type="button" onclick="doChangeMyPw()">確定變更</button>
     <button class="btn" value="x">取消</button>`);
}
async function doChangeMyPw(){
  const o=document.getElementById('cp_old').value,
        n=document.getElementById('cp_new').value,
        n2=document.getElementById('cp_new2').value;
  if(n.length<6) return toast('新密碼至少 6 個字元');
  if(n!==n2) return toast('兩次輸入的新密碼不一致');
  try{
    const d=await apiPost('changePw',null,{oldPassword:o,newPassword:n});
    if(d.error) return toast(d.error);
    closeDlg(); toast('密碼已更新');
  }catch(e){ toast('連不上伺服器'); }
}

/* 顯示目前身分 */
function paintMe(){
  const el=document.getElementById('meBox'); if(!el) return;
  if(!CLOUD){ el.innerHTML=''; return; }
  if(!ME){ el.innerHTML=`<span class="tag bad">未登入</span>
    <button class="btn sm pri" style="margin:0" onclick="openGate('login')">登入</button>`; return; }
  const tag = ME.legacy ? '<span class="tag warn">共用密碼·唯讀</span>'
            : `<span class="tag ${ME.role==='admin'?'ok':(ME.role==='editor'?'info':'gray')}">${esc(ME.roleName||'')}</span>`;
  el.innerHTML=`<b>${esc(ME.name||'')}</b>${tag}
    <button class="btn sm" style="margin:0" onclick="logout()">登出</button>`;
  const nu=document.getElementById('navUsers');
  if(nu) nu.style.display = isAdmin() ? '' : 'none';
  const na=document.getElementById('navAcct');
  if(na) na.style.display = (ME && !ME.legacy) ? '' : 'none';
}

function b64ToU8(b64){
  const bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
const xmlEsc=s=>String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;');

/* 把含有「異動原因」那個 run 的字級改成 9pt（sz 18） */
function shrinkReasonRun(xml, escReason){
  const at = xml.indexOf(escReason);
  if(at < 0) return xml;
  const rs = xml.lastIndexOf('<w:rPr>', at), re_ = xml.indexOf('</w:rPr>', rs);
  if(rs < 0 || re_ < 0 || re_ > at) return xml;
  const rpr = xml.slice(rs, re_ + 8);
  const nw = rpr.indexOf('<w:sz ') >= 0
    ? rpr.replace(/<w:sz w:val="\d+"\/>/, '<w:sz w:val="18"/>')
    : rpr.replace('</w:rPr>', '<w:sz w:val="18"/></w:rPr>');
  return xml.slice(0, rs) + nw + xml.slice(re_ + 8);
}

/* 單據 → .docx 並下載 */
async function docFromOrder(o){
  if(typeof JSZip==='undefined') return toast('Word 產出元件尚未載入，請重新整理頁面後再試');
  const CK=(on)=>on?'■':'□';
  const map={
    NO:o.no||'', DATE:o.date||'', DEPT:o.dept||'製造部', REASON:o.reason||'',
    W1:CK(o.house==='研發倉'), W2:CK(o.house==='物料倉'), W3:CK(o.house==='成品倉'),
    T1:CK(o.type==='入庫'),   T2:CK(o.type==='領料'),   T3:CK(o.type==='退料'),
    MEMO:o.memo||'', USER:o.by||''
  };
  const lines=o.lines||[];
  for(let i=1;i<=24;i++){
    const l=lines[i-1];
    map['r'+i+'n']= '';        /* 項次欄由 Word 自己自動編號，這裡留空免得重複 */
    map['r'+i+'c']= l? (l.code||'') : '';
    map['r'+i+'m']= l? (l.name||'') : '';
    map['r'+i+'q']= l? String(l.qty) : '';
    map['r'+i+'u']= l? (l.unit||'pcs') : '';
    map['r'+i+'b']= '';        /* 依規範：品項列備註留空，用途統一寫在表頭「異動原因」 */
  }
  const zip=await JSZip.loadAsync(b64ToU8(DOC_TPL_B64));
  let xml=await zip.file('word/document.xml').async('string');
  xml=xml.replace(/\{\{([A-Za-z0-9]+)\}\}/g,(m,k)=> k in map ? xmlEsc(map[k]) : '');
  /* 規範：異動原因超過 22 字就縮成 9pt，免得表頭撐高把單子擠到第二頁 */
  if(String(map.REASON).length > 22) xml = shrinkReasonRun(xml, xmlEsc(map.REASON));
  zip.file('word/document.xml',xml);
  const blob=await zip.generateAsync({type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const fn=`${o.no||'單據'}_${(o.reason||o.type||'').replace(/[\\/:*?"<>|]/g,'')}.docx`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fn; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  /* 明細超過 24 行時，範本一頁放不下，另外提醒 */
  if(lines.length>24) toast(`已產出 ${fn}；此單有 ${lines.length} 行，Word 表格只放得下 24 行，其餘請看系統紀錄`);
  else toast('已產出 '+fn);
}

<script>
/* ============================================================
   Excel 解析
   ============================================================ */
const S_=v=>v==null?'':String(v).trim();
const N_=v=>{if(v==null||v==='')return null;
  if(typeof v==='number')return v;
  const m=String(v).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;};

async function readWB(file){
  const buf=await file.arrayBuffer();
  return XLSX.read(buf,{type:'array'});
}
/* 料號總表 */
function parseItems(wb){
  const ws=wb.Sheets[wb.SheetNames.find(n=>n.includes('料號'))||wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let hr=aoa.findIndex(r=>r&&r.some(c=>S_(c)==='品號'));
  if(hr<0) hr=0;
  const H=aoa[hr].map(S_);
  const col=names=>{for(const n of names){const i=H.indexOf(n);if(i>=0)return i;}return -1;};
  const C={code:col(['品號','料號']),msb:col(['MSB']),name:col(['品名','名稱']),spec:col(['規格']),
    stock:col(['庫存數量','庫存']),unit:col(['單位']),supplier:col(['供應商']),cost:col(['單位成本','單價']),
    safety:col(['安全庫存']),lead:col(['交期']),loc:col(['儲位']),note:col(['備註'])};
  const out=[];
  for(let i=hr+1;i<aoa.length;i++){
    const r=aoa[i]||[]; const code=S_(r[C.code]);
    if(!code||code==='-----'||code==='品號') continue;
    const g=k=>C[k]>=0?r[C[k]]:null;
    out.push({code,msb:S_(g('msb')),name:S_(g('name')),spec:S_(g('spec')),
      stock:N_(g('stock'))||0,unit:S_(g('unit'))||'pcs',supplier:S_(g('supplier')),
      cost:N_(g('cost')),safety:N_(g('safety')),lead:S_(g('lead')),loc:S_(g('loc')),note:S_(g('note'))});
  }
  const m={};out.forEach(o=>{ if(m[o.code]){Object.keys(o).forEach(k=>{if(!m[o.code][k]&&o[k])m[o.code][k]=o[k];});}
    else m[o.code]=o;});
  return Object.values(m);
}
/* BOM 檔（多工作表） */
function parseBoms(wb){
  const boms=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    let prod=null,pname='',pspec='',hr=-1;
    for(let i=0;i<Math.min(aoa.length,40);i++){
      const v=(aoa[i]||[]).map(S_);
      if(v.includes('品號')&&v.includes('產品名稱')){
        prod=v[v.indexOf('品號')+1]||''; pname=v[v.indexOf('產品名稱')+1]||'';
        const k=v.indexOf('規格'); pspec=k>=0?(v[k+1]||''):'';
      }
      if(v.includes('項次')&&v.includes('階層')){hr=i;break;}
    }
    if(!prod||hr<0) return;
    const H=(aoa[hr]||[]).map(S_);
    const ci=n=>H.indexOf(n);
    const cLv=ci('階層'),cCode=H.indexOf('品號',ci('階層')),cName=ci('品名'),
          cSpec=ci('規格'),cQty=ci('用量'),cUnit=ci('單位'),cNote=ci('備註'),
          cStock=ci('庫存數量'),cCost=ci('單位成本');
    const lines=[];
    for(let i=hr+1;i<aoa.length;i++){
      const r=aoa[i]||[]; const lv=S_(r[cLv]), code=S_(r[cCode]);
      if(!code||!/^\d+$/.test(lv)) continue;
      /* BOM 表上的庫存／單價一併帶出，供主檔未收錄的料號自動建檔使用 */
      lines.push({level:+lv,code,name:S_(r[cName]),spec:cSpec>=0?S_(r[cSpec]):'',
        qty:N_(r[cQty])==null?1:N_(r[cQty]),unit:S_(r[cUnit])||'pcs',note:cNote>=0?S_(r[cNote]):'',
        _stock:cStock>=0?N_(r[cStock]):null, _cost:cCost>=0?N_(r[cCost]):null});
    }
    if(lines.length) boms.push({id:prod,code:prod,name:pname,spec:pspec,source:sn,lines});
  });
  return boms;
}

      <div class="row" style="margin-top:12px">

      </div>

    return;
  }
  const invVal=items.reduce((s,i)=>s+(i.cost||0)*(i.stock||0),0);
  const zero=items.filter(i=>!(i.stock>0)).length;
  const noCost=items.filter(i=>i.cost==null||i.cost==='').length;
  const below=items.filter(i=>i.safety>0&&(i.stock||0)<i.safety);
  const bomRows=S.boms.map(b=>{const c=bomCost(b);return {b,...c};});
  $('#v-dash').innerHTML=`
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><div class="k">料號總數</div><div class="v">${items.length}</div></div>
    <div class="stat"><div class="k">BOM 數量</div><div class="v">${S.boms.length}</div></div>
    <div class="stat ok"><div class="k">庫存總值</div><div class="v">${money(invVal)}</div></div>
    <div class="stat warn"><div class="k">零庫存料號</div><div class="v">${zero}</div></div>
    <div class="stat bad"><div class="k">低於安全庫存</div><div class="v">${below.length}</div></div>
    <div class="stat"><div class="k">未設單價</div><div class="v">${noCost}</div></div>
  </div>
  <div class="split">
    <div class="card"><h2>BOM 概覽<span class="sub">單台材料成本（展開至葉料號）</span></h2>
      <div class="tblwrap" style="max-height:340px"><table><thead><tr>
        <th class="nos">品號</th><th class="nos">產品名稱</th><th class="nos num">葉料號</th>
        <th class="nos num">單台成本</th></tr></thead><tbody>
        ${bomRows.map(r=>`<tr style="cursor:pointer" onclick="openBom('${esc(r.b.code)}')">
          <td class="mono">${esc(r.b.code)}</td><td>${esc(r.b.name)}</td>
          <td class="num">${r.leafN}</td>
          <td class="num">${money(r.cost)}${r.missing?` <span class="tag warn">${r.missing} 項無價</span>`:''}</td>
        </tr>`).join('')||'<tr><td colspan="4" class="empty">尚無 BOM</td></tr>'}
      </tbody></table></div></div>
    <div class="card"><h2>低於安全庫存<span class="sub">需補料</span></h2>
      <div class="tblwrap" style="max-height:340px"><table><thead><tr>
        <th class="nos">品號</th><th class="nos">品名</th><th class="nos num">庫存</th>
        <th class="nos num">安全量</th><th class="nos num">缺口</th></tr></thead><tbody>
        ${below.sort((a,b)=>(a.stock-a.safety)-(b.stock-b.safety)).map(i=>`<tr class="lack">
          <td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td>
          <td class="num">${nf(i.stock)}</td><td class="num">${nf(i.safety)}</td>
          <td class="num" style="color:var(--bad)">${nf(i.safety-i.stock)}</td></tr>`).join('')
          ||'<tr><td colspan="5" class="empty">無資料（安全庫存欄位多數未設定）</td></tr>'}
      </tbody></table></div></div>
  </div>
  <div class="card"><h2>異動紀錄<span class="sub">最近 10 筆</span></h2>
    ${S.history.length?`<div class="tblwrap" style="max-height:280px"><table><thead><tr>
      <th class="nos">時間</th><th class="nos">來源檔</th><th class="nos">摘要</th><th class="nos"></th>
      </tr></thead><tbody>${S.history.slice(0,10).map((h,i)=>`<tr>
        <td class="mono">${esc(h.ts)}</td><td>${esc(h.file||'')}</td>
        <td><span class="tag add">新增 ${h.sum.added}</span> <span class="tag del">移除 ${h.sum.removed}</span>
            <span class="tag info">庫存 ${h.sum.stock}</span> <span class="tag warn">單價 ${h.sum.cost}</span>
            <span class="tag gray">其他 ${h.sum.other}</span></td>
        <td><button class="btn sm" onclick="showHistory(${i})">明細</button></td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">尚無更新紀錄。到「更新比對」上傳新版料號總表即可產生。</div>'}
  </div>`;
}
</script>
<script>
/* ============================================================
   料號主檔
   ============================================================ */
const itemSt={key:'code',dir:1,q:'',f:'all',fam:'',cat:'',render:renderItems};
const SORTKEYS=[['code','品號'],['name','品名'],['stock','庫存'],['cost','單價'],['value','庫存金額'],['supplier','供應商'],['loc','儲位']];

/* ============================================================
   編碼原則（依「編碼原則20260806.xlsx」）
   料號 9 碼＝物料類別(1) 材料M／半成品S／成品F
              ＋系列(1) 包材P／原材R／電子E／膠材G／機構M／客供C／軟韌體S
              ＋分類(2) ＋流水號(5)
   S 類與 F 類為「另行編碼」（現有格式如 F01-ORL0101），只帶前綴不自動取號
   ============================================================ */
const CODEFAM=[
  {k:'MP', t:'包材類 (MP)',      auto:true,  cats:[
    ['01','外箱（紙箱／紙板／插底盒）'],['02','禮盒（印刷彩盒／白盒／塑膠或金屬包裝外盒）'],
    ['03','標籤'],['04','包裝袋（PE／PP 或其他材質）'],['05','說明書'],['99','其它包材']]},
  {k:'MR', t:'原材類 (MR)',      auto:true,  cats:[['01','原材料'],['99','其它原材']]},
  {k:'ME', t:'電子零件類 (ME)',  auto:true,  cats:[
    ['01','變壓器'],['02','電池'],['03','速接器'],['04','液晶顯示器 (LCD)'],['05','發光二極體 (LED)'],
    ['06','RCL 零件'],['07','積體電路 (IC)'],['08','印刷電路板 (PCB)'],['09','電路模組 (PCBA)'],
    ['10','影像模組（光學鏡組＋感光元＋PCBA）'],['11','線材（芯線／排線或其他訊號線）'],
    ['12','馬達'],['99','其它電子零件']]},
  {k:'MG', t:'膠材類 (MG)',      auto:true,  cats:[['01','膠材'],['02','液態材料'],['99','貼紙']]},
  {k:'MM', t:'機構零件類 (MM)',  auto:true,  cats:[
    ['01','塑膠機構'],['02','金屬機構'],['03','玻璃機構'],['04','矽橡膠軟料機構'],
    ['05','光學鏡組（光學鏡片／鏡頭模組）'],['99','其它機構']]},
  {k:'MC', t:'客供料 (MC)',      auto:true,  cats:[['01','炳碩生醫']]},
  {k:'MS', t:'軟體／韌體 (MS)',  auto:true,  cats:[['01','軟體／韌體']]},
  {k:'S',  t:'半成品類 (S)',     auto:false, cats:[
    ['01','廠內加工半成品'],['02','廠外加工半成品'],['03','內視鏡代工廠外包加工半成品']]},
  {k:'F',  t:'成品類 (F)',       auto:false, cats:[['01','已包裝成品']]}
];
const famOf = k => CODEFAM.find(f=>f.k===k);
/* 分類代碼（MP01、F01…）→ 中文名稱 */
const CODENAME = (()=>{ const m={};
  CODEFAM.forEach(f=>f.cats.forEach(([c,n])=>m[f.k+c]=n)); return m; })();
/* 品號 → 所屬分類前綴（MP01 / F01…），認不出來回空字串 */
function prefixOf(code){
  const s=String(code||'').toUpperCase();
  let m=s.match(/^([MS][PRGEMCS]\d{2})/);   if(m) return m[1];      // 9 碼制 MP01…
  m=s.match(/^([SF]\d{2})(?=[-\d]|$)/);     if(m) return m[1];      // S03 / F01
  return '';
}
/* 該分類目前有幾筆、最大流水號是多少、下一號碼是什麼 */
function codeStat(pfx){
  const f=famOf(pfx.replace(/\d{2}$/,''));
  const list=S.items.filter(i=>prefixOf(i.code)===pfx);
  if(!f||!f.auto) return {count:list.length, next:pfx+'-', auto:false, max:''};
  let max=0, maxCode='';
  list.forEach(i=>{ const m=String(i.code).match(/^[A-Z]{2}\d{2}(\d{5})$/);
    if(m){ const n=parseInt(m[1],10); if(n>max){max=n;maxCode=i.code;} } });
  return {count:list.length, max:maxCode, auto:true,
          next: pfx + String(max+1).padStart(5,'0')};
}
/* 工具列只建一次；排序／篩選／搜尋僅重繪表格，避免重繪時 <select> 被銷毀
   造成點擊穿透到上方導覽列（macOS 原生下拉選單會疊在選單框上方展開） */
function itemRows(){
  const q=itemSt.q.toLowerCase().trim();
  let rows=S.items.filter(i=>{
    if(q&&!(`${i.code} ${i.name} ${i.spec} ${i.supplier} ${i.loc}`.toLowerCase().includes(q))) return false;
    if(itemSt.f==='low')  return i.safety>0&&(i.stock||0)<i.safety;
    if(itemSt.f==='zero') return !(i.stock>0);
    if(itemSt.f==='nocost')return i.cost==null||i.cost==='';
    if(itemSt.f==='ghost')return !!i._ghost||/未收錄/.test(i.note||'');
    return true;
  }).filter(i=>{
    if(!itemSt.fam) return true;
    const p=prefixOf(i.code);
    if(itemSt.cat) return p===itemSt.fam+itemSt.cat;
    if(itemSt.fam==='__none') return !p;
    return p.startsWith(itemSt.fam);
  });
  const val=i=>(i.cost||0)*(i.stock||0);
  rows.sort((a,b)=>{const k=itemSt.key;
    if(k==='value') return cmp(val(a),val(b),itemSt.dir);
    return cmp(a[k],b[k],itemSt.dir);});
  return rows;
}
const itemVal=i=>(i.cost||0)*(i.stock||0);

function vItems(){
  $('#v-items').innerHTML=`
  <div class="card">
    <div class="row">
      <div class="grow"><input type="search" id="iq" placeholder="搜尋品號 / 品名 / 規格 / 供應商 / 儲位…" value="${esc(itemSt.q)}"></div>
      <div class="chips">
        ${[['all','全部'],['low','低於安全庫存'],['zero','零庫存'],['nocost','無單價'],['ghost','BOM 帶入未建檔']]
          .map(([k,t])=>`<span class="chip ${itemSt.f===k?'on':''}" data-f="${k}">${t}</span>`).join('')}
      </div>
      <button class="btn pri" onclick="newItem()">＋ 新增料號</button>
      <button class="btn" onclick="bulkAdd()">批次新增</button>
      <button class="btn" onclick="importItemsFile()">Excel 匯入料號</button>
      <button class="btn" onclick="exportItems()">匯出 Excel</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="mini">排序</span>
      <select style="width:150px" id="sortK">
        ${SORTKEYS.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}
      </select>
      <button class="btn sm" id="sortDir"></button>
      <span class="mini mut">也可直接點表頭排序</span>
      <div class="grow"></div>
      <span class="mini" id="itemCount"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="mini">品項</span>
      <select style="width:180px" id="filFam">
        <option value="">全部品項</option>
        ${CODEFAM.map(f=>`<option value="${f.k}">${esc(f.t)}</option>`).join('')}
        <option value="__none">未依編碼原則</option>
      </select>
      <select style="width:280px" id="filCat"></select>
      <button class="btn sm" id="filClr">清除</button>
      <span class="mini mut" id="filHint"></span>
    </div>
    <div class="hint">點任一列可看明細、用途反查，並可編輯或刪除該料號。</div>
  </div>
  <div id="itemTbl"></div>`;
  /* 工具列事件只綁一次，之後都只重繪表格 */
  $('#iq').oninput=e=>{itemSt.q=e.target.value;renderItems();};
  $('#sortK').onchange=e=>{itemSt.key=e.target.value;renderItems();};
  $('#sortDir').onclick=()=>{itemSt.dir=-itemSt.dir;renderItems();};
  $('#filFam').onchange=e=>{itemSt.fam=e.target.value;itemSt.cat='';fillCatSel();renderItems();};
  $('#filCat').onchange=e=>{itemSt.cat=e.target.value;renderItems();};
  $('#filClr').onclick=()=>{itemSt.fam='';itemSt.cat='';$('#filFam').value='';fillCatSel();renderItems();};
  fillCatSel();
  document.querySelectorAll('#v-items .chip').forEach(c=>c.onclick=()=>{
    itemSt.f=c.dataset.f;
    document.querySelectorAll('#v-items .chip').forEach(x=>x.classList.toggle('on',x===c));
    renderItems();});
  renderItems();
}

/* 第二級「分類」下拉，內容隨系列變動，並附上該分類目前筆數 */
function fillCatSel(){
  const sel=document.getElementById('filCat'); if(!sel) return;
  const f=famOf(itemSt.fam);
  if(!f){ sel.innerHTML='<option value="">—</option>'; sel.disabled=true; updFilHint(); return; }
  sel.disabled=false;
  sel.innerHTML='<option value="">全部分類（'+esc(f.t)+'）</option>'+
    f.cats.map(([c,n])=>{
      const st=codeStat(f.k+c);
      return `<option value="${c}">${f.k}${c} ${esc(n)}（${st.count}）</option>`;
    }).join('');
  sel.value=itemSt.cat||'';
  updFilHint();
}
/* 只更新提示文字，不動 <select> 本身（重建下拉會讓 macOS 的選單點擊穿透） */
function updFilHint(){
  const h=document.getElementById('filHint'); if(!h) return;
  if(itemSt.fam==='__none'){
    h.textContent='列出品號不符合編碼原則的料號（含 F01-ORL0101 這類舊格式與 -1 版本號）'; return; }
  const f=famOf(itemSt.fam);
  if(f&&itemSt.cat){
    const st=codeStat(f.k+itemSt.cat);
    h.textContent = st.auto ? `目前 ${st.count} 筆，最大號 ${st.max||'—'}，下一號 ${st.next}`
                            : `目前 ${st.count} 筆（此類另行編碼）`;
  } else h.textContent='';
}

function renderItems(){
  const rows=itemRows(), total=rows.reduce((s,i)=>s+itemVal(i),0);
  const sk=document.getElementById('sortK'); if(sk) sk.value=itemSt.key;
  const sd=document.getElementById('sortDir');
  if(sd) sd.textContent=itemSt.dir>0?'▲ 遞增':'▼ 遞減';
  const cnt=document.getElementById('itemCount');
  if(cnt) cnt.innerHTML=`共 <b>${rows.length}</b> 筆 ／ 全部 ${S.items.length} 筆　庫存總值 <b>${money(total)}</b>`;
  updFilHint();
  const box=document.getElementById('itemTbl'); if(!box) return;
  box.innerHTML=`<div class="tblwrap"><table id="itbl"><thead><tr>
    <th data-k="code">品號${arrow(itemSt,'code')}</th>
    <th data-k="name">品名${arrow(itemSt,'name')}</th>
    <th data-k="spec">規格${arrow(itemSt,'spec')}</th>
    <th data-k="stock" class="num">庫存${arrow(itemSt,'stock')}</th>
    <th data-k="unit">單位${arrow(itemSt,'unit')}</th>
    <th data-k="cost" class="num">單位成本${arrow(itemSt,'cost')}</th>
    <th data-k="value" class="num">庫存金額${arrow(itemSt,'value')}</th>
    <th data-k="safety" class="num">安全庫存${arrow(itemSt,'safety')}</th>
    <th data-k="supplier">供應商${arrow(itemSt,'supplier')}</th>
    <th data-k="loc">儲位${arrow(itemSt,'loc')}</th>
    <th class="nos">備註</th><th class="nos" style="width:150px">操作</th></tr></thead><tbody>
    ${rows.map(i=>`<tr style="cursor:pointer" onclick="showItem('${esc(i.code)}')"
        class="${i.safety>0&&(i.stock||0)<i.safety?'lack':''}">
      <td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td><td class="mut">${esc(i.spec)}</td>
      <td class="num">${nf(i.stock)}</td><td class="mut">${esc(i.unit)}</td>
      <td class="num">${i.cost==null||i.cost===''?'<span class="tag gray">未設</span>':nf(i.cost)}</td>
      <td class="num">${itemVal(i)?nf(Math.round(itemVal(i))):''}</td>
      <td class="num mut">${nf(i.safety)}</td><td class="mut">${esc(i.supplier)}</td>
      <td class="mut">${esc(i.loc)}</td><td class="mut">${esc(i.note)}</td>
      <td class="num" onclick="event.stopPropagation()">
        <button class="btn sm" onclick="addMove('${esc(i.code)}')" title="入庫／領料／退料">異動</button>
        <button class="btn sm" onclick="editItem('${esc(i.code)}')">編輯</button>
        <button class="btn sm danger" onclick="delItem('${esc(i.code)}')">✕</button></td></tr>`).join('')
      ||'<tr><td colspan="12" class="empty">查無資料</td></tr>'}
  </tbody></table></div>`;
  bindSort($('#itbl'),itemSt);
  if(typeof applyReadonlyUI==='function') applyReadonlyUI();
}
function showItem(code){
  const i=itemOf(code), used=whereUsed(code);
  dialog(`${code}　${i.name||''}`,`
    <dl class="kv">
      <dt>品名</dt><dd>${esc(i.name)}</dd>
      <dt>規格</dt><dd>${esc(i.spec)||'—'}</dd>
      <dt>庫存數量</dt><dd><b>${nf(i.stock)}</b> ${esc(i.unit)}</dd>
      <dt>單位成本</dt><dd>${i.cost==null?'未設定':money(i.cost)}</dd>
      <dt>庫存金額</dt><dd>${money((i.cost||0)*(i.stock||0))}</dd>
      <dt>安全庫存</dt><dd>${i.safety==null?'—':nf(i.safety)}</dd>
      <dt>供應商</dt><dd>${esc(i.supplier)||'—'}</dd>
      <dt>交期</dt><dd>${esc(i.lead)||'—'}</dd>
      <dt>儲位</dt><dd>${esc(i.loc)||'—'}</dd>
      <dt>備註</dt><dd>${esc(i.note)||'—'}</dd>
    </dl>
    <h3 style="font-size:13px;margin:16px 0 8px">用途反查　<span class="mut" style="font-weight:400">被 ${used.length} 張 BOM 使用（單台用量）</span></h3>
    ${used.length?`<div class="tblwrap" style="max-height:240px"><table class="grid"><thead><tr>
      <th class="nos">BOM 品號</th><th class="nos">產品</th><th class="nos">角色</th><th class="nos num">單台用量</th>
      </tr></thead><tbody>${used.map(u=>`<tr><td class="mono">${esc(u.bom.code)}</td>
      <td>${esc(u.bom.name)}</td><td><span class="tag ${u.role==='半成品'?'info':'gray'}">${u.role}</span></td>
      <td class="num">${nf(u.qty)} ${esc(i.unit)}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="mini">未被任何 BOM 使用</div>'}`,
    `<button class="btn" type="button" onclick="editItem('${esc(code)}')">編輯</button>
     <button class="btn danger" type="button" onclick="delItem('${esc(code)}')">刪除料號</button>
     <button class="btn" value="x">關閉</button>`);
}
function itemForm(i, isNew){
  const f=(k,l,t)=>`<div class="fld"><label>${l}</label>
    <input id="if_${k}" type="${t||'text'}" value="${esc(i[k]==null?'':i[k])}"></div>`;
  const pfx = prefixOf(i.code);
  const picker = `
  <div class="card" style="margin-bottom:12px;background:var(--bg);padding:12px">
    <div class="fld" style="margin-bottom:8px"><label>品項類別${isNew?'（選了會自動帶出下一個品號）':''}</label>
      <div class="row" style="gap:8px">
        <select style="width:190px" id="if_fam">
          <option value="">請選擇系列…</option>
          ${CODEFAM.map(x=>`<option value="${x.k}"${pfx.startsWith(x.k)&&famOf(x.k)?' selected':''}>${esc(x.t)}</option>`).join('')}
        </select>
        <select style="width:300px" id="if_cat"><option value="">—</option></select>
      </div>
    </div>
    <div class="mini mut" id="if_codeHint">依編碼原則：物料類別(1)＋系列(1)＋分類(2)＋流水號(5)，共 9 碼。半成品與成品為另行編碼，只帶前綴。</div>
  </div>`;
  return picker + `<div class="split">
    <div>${f('code','品號 *')}${f('name','品名')}${f('spec','規格')}${f('unit','單位')}${f('supplier','供應商')}${f('loc','儲位')}</div>
    <div>${f('stock','庫存數量','number')}${f('cost','單位成本','number')}${f('safety','安全庫存','number')}
      ${f('lead','交期')}${f('msb','MSB')}${f('note','備註')}</div></div>`;
}
/* ---------- 品項類別選擇器（新增料號 / BOM 編輯裡建主檔 共用） ----------
   pre 是欄位 id 前綴：主表單用 'if_'，BOM 編輯的第二層對話框用 'jf_' */
function pkEl(pre,k){ return document.getElementById(pre+k); }

function pkFillCat(pre){
  const fs=pkEl(pre,'fam'), cs=pkEl(pre,'cat'), ce=pkEl(pre,'code');
  if(!fs||!cs) return;
  const f=famOf(fs.value);
  if(!f){ cs.innerHTML='<option value="">—</option>'; cs.disabled=true; pkHint(pre); return; }
  cs.disabled=false;
  const cur=prefixOf(ce?ce.value:'').slice(f.k.length);
  cs.innerHTML='<option value="">請選擇分類…</option>'+
    f.cats.map(([c,n])=>`<option value="${c}"${c===cur?' selected':''}>${f.k}${c} ${esc(n)}</option>`).join('');
  pkHint(pre);
}
/* 依目前選的分類把品號帶進欄位 */
function pkApplyCode(pre){
  const fs=pkEl(pre,'fam'), cs=pkEl(pre,'cat'), ce=pkEl(pre,'code');
  if(!fs||!cs||!ce||!fs.value||!cs.value) return pkHint(pre);
  const pfx=fs.value+cs.value, st=codeStat(pfx);
  ce.value=st.next;
  ce.focus();
  /* 自動編號時整串選起來方便改；另行編碼時游標停在「F01-」後面直接接著打 */
  if(st.auto) ce.select(); else ce.setSelectionRange(ce.value.length, ce.value.length);
  pkHint(pre);
}
function pkHint(pre){
  const h=pkEl(pre,'codeHint'); if(!h) return;
  const fs=pkEl(pre,'fam'), cs=pkEl(pre,'cat');
  if(!fs||!cs||!fs.value||!cs.value){
    h.textContent='依編碼原則：物料類別(1)＋系列(1)＋分類(2)＋流水號(5)，共 9 碼。半成品與成品為另行編碼，只帶前綴。';
    return; }
  const pfx=fs.value+cs.value, st=codeStat(pfx);
  h.innerHTML = st.auto
    ? `<b>${pfx}　${esc(CODENAME[pfx]||'')}</b>　目前 ${st.count} 筆，最大號 ${st.max||'（尚無）'}　→　下一號 <b>${st.next}</b>`
    : `<b>${pfx}　${esc(CODENAME[pfx]||'')}</b>　目前 ${st.count} 筆。此類另行編碼，請接著輸入產品代碼（例：${pfx}-ORL0101）`;
}
/* 手動改品號時，讓上方兩個下拉跟著反白對應的類別 */
function pkSyncFromCode(pre){
  const ce=pkEl(pre,'code'), fs=pkEl(pre,'fam'), cs=pkEl(pre,'cat');
  if(!ce||!fs||!cs) return;
  const p=prefixOf(ce.value);
  const fam=p?CODEFAM.find(f=>p.startsWith(f.k)&&f.cats.some(([c])=>f.k+c===p)):null;
  if(!fam){ pkHint(pre); return; }
  if(fs.value!==fam.k){ fs.value=fam.k; pkFillCat(pre); }
  cs.value=p.slice(fam.k.length);
  pkHint(pre);
}
/* 把選擇器接上事件；isNew 為 true 時把焦點放在系列下拉 */
function bindCodePicker(pre,isNew){
  const fs=pkEl(pre,'fam'), cs=pkEl(pre,'cat'), ce=pkEl(pre,'code');
  if(!fs||!cs) return;
  fs.onchange=()=>pkFillCat(pre);
  cs.onchange=()=>pkApplyCode(pre);
  if(ce) ce.oninput=()=>pkSyncFromCode(pre);
  pkFillCat(pre);                       /* 編輯既有料號時只反白類別，不覆蓋品號 */
  if(isNew) setTimeout(()=>fs.focus(),80);
}

function editItem(code){
  const i=code?{...itemOf(code)}:{code:'',name:'',spec:'',unit:'pcs',stock:0,cost:null,safety:null,supplier:'',loc:'',lead:'',msb:'',note:''};
  dialog(code?`編輯料號 ${code}`:'新增料號',itemForm(i,!code),
    `<button class="btn pri" type="button" onclick="saveItem('${esc(code||'')}')">儲存</button>
     <button class="btn" value="x">取消</button>`);
  bindCodePicker('if_',!code);
}
const newItem=()=>editItem('');
async function saveItem(orig){
  const g=k=>document.getElementById('if_'+k).value.trim();
  const gn=k=>{const v=g(k);return v===''?null:parseFloat(v);};
  const code=g('code'); if(!code) return toast('品號必填');
  if(!orig&&IDX[code]) return toast('品號已存在');
  const o={code,name:g('name'),spec:g('spec'),unit:g('unit')||'pcs',stock:gn('stock')||0,
    cost:gn('cost'),safety:gn('safety'),supplier:g('supplier'),loc:g('loc'),lead:g('lead'),msb:g('msb'),note:g('note')};
  if(orig){const ix=S.items.findIndex(x=>x.code===orig);
    if(ix>=0)S.items[ix]=o; else S.items.push(o);
    if(orig!==code) S.boms.forEach(b=>b.lines.forEach(l=>{if(l.code===orig)l.code=code;}));
  } else S.items.push(o);

}
/* ---------- 刪除料號：仍被 BOM 引用則阻擋 ---------- */
async function delItem(code){
  const used=whereUsed(code);
  const direct=S.boms.filter(b=>b.lines.some(l=>l.code===code));
  if(used.length||direct.length){
    const list=[...new Set([...used.map(u=>u.bom),...direct])];
    return dialog('無法刪除料號',`
      <p>料號 <b class="mono">${esc(code)}</b>（${esc(itemOf(code).name)}）仍被下列 BOM 使用，
         刪除會造成 BOM 斷鏈，因此不允許刪除。</p>

        <th class="nos">BOM 品號</th><th class="nos">產品名稱</th></tr></thead><tbody>
        ${list.map(b=>`<tr><td class="mono">${esc(b.code)}</td><td>${esc(b.name)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="hint">請先到「BOM 管理」把這些 BOM 中引用此料號的行刪掉，再回來刪除料號。</div>`,
      '<button class="btn" value="x">知道了</button>');

  if(!confirm(`確定刪除料號 ${code}？此料號未被任何 BOM 使用。`)) return;

}
/* ---------- 批次新增 ---------- */
function bulkAdd(){

function bulkParse(){
  const txt=document.getElementById('bulkTxt').value;
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const c=l.includes('\t')?l.split('\t'):l.split(',');
    const g=i=>(c[i]==null?'':String(c[i]).trim());
    const n=i=>{const v=g(i);return v===''?null:parseFloat(v.replace(/,/g,''));};
    return {code:g(0),name:g(1),spec:g(2),stock:n(3)||0,unit:g(4)||'pcs',supplier:g(5),
      cost:n(6),safety:n(7),loc:g(8),note:g(9),lead:'',msb:''};
  }).filter(o=>o.code);
}
function bulkPreview(){
  const rows=bulkParse();
  const nw=rows.filter(r=>!IDX[r.code]).length;
  document.getElementById('bulkPrev').innerHTML=rows.length
    ? `解析到 <b>${rows.length}</b> 筆：新增 ${nw} 筆、更新 ${rows.length-nw} 筆<br>
       ${rows.slice(0,5).map(r=>`<span class="mono">${esc(r.code)}</span> ${esc(r.name)} 庫存 ${nf(r.stock)} 單價 ${nf(r.cost)}`).join('<br>')}
       ${rows.length>5?'<br>…':''}`
    : '<span style="color:var(--bad)">沒有解析到任何資料</span>';
}
async function bulkSave(){
  const rows=bulkParse();
  if(!rows.length) return toast('沒有可新增的資料');
  let a=0,u=0;
  rows.forEach(r=>{const ix=S.items.findIndex(i=>i.code===r.code);
    if(ix>=0){S.items[ix]={...S.items[ix],...r};u++;} else {S.items.push(r);a++;}});
  await save(); closeDlg(); vItems(); vDash(); setHdr();
  toast(`批次完成：新增 ${a} 筆、更新 ${u} 筆`);
}

  const leafVal=Object.entries(ex.leaf).reduce((s,[k,q])=>s+(itemOf(k).cost||0)*q,0);

/* ---------- 從現有 BOM 拆出獨立子 BOM ---------- */
function findNode(bomCode,code){
  let hit=null;
  (function walk(nodes,path){
    nodes.forEach(n=>{
      if(hit) return;
      if(n.code===code){hit={node:n,path:path};return;}
      const r=rawKids(n,path);
      if(r.kids.length&&!path.includes(n.code)) walk(r.kids,path.concat(n.code));
    });
  })(buildTree(BIDX[bomCode]),[bomCode]);
  return hit;
}
/* 把節點的下階攤平成 lines，階層重新從 1 起算 */
function flattenSub(node){
  const out=[], base=node.level;
  (function walk(nodes){
    nodes.forEach(n=>{
      out.push({level:Math.max(1,n.level-base),code:n.code,name:n.name,spec:n.spec,
                qty:n.qty,unit:n.unit,note:n.note});
      if(n.children&&n.children.length) walk(n.children);
    });
  })(node.children||[]);
  return out;
}

      <th class="nos num">用量</th><th class="nos">單位</th><th class="nos num">單價</th>
      </tr></thead><tbody>
      ${lines.map((l,i)=>`<tr><td class="no">${lineNos(lines)[i]}</td>
        <td class="mono">${esc(l.code)}</td><td>${esc(l.name||itemOf(l.code).name)}</td>
        <td class="num">${nf(l.qty)}</td><td class="mut">${esc(l.unit)}</td>
        <td class="num">${itemOf(l.code).cost==null?'<span class="tag gray">未設</span>':nf(itemOf(l.code).cost)}</td>
        </tr>`).join('')}
    </tbody></table></div>
    <div class="hint">單台材料成本約 <b>${money(cost)}</b>。
      原本的 ${esc(curBom)} 不會改變 — 它底下已經有這些明細，展開時仍以原本的階層為準，不會重複計算。</div>`,
    `<button class="btn pri" type="button" onclick="doSplitSubBom('${esc(code)}')">建立 BOM</button>
     <button class="btn" value="x">取消</button>`);
}
async function doSplitSubBom(code){
  const hit=findNode(curBom,code); if(!hit) return;
  const lines=flattenSub(hit.node);
  const src=curBom;
  S.boms.push({id:code,code:code,
    name:document.getElementById('sb_name').value.trim()||itemOf(code).name||'',
    spec:document.getElementById('sb_spec').value.trim()||'',
    source:`由 ${src} 拆出`, note:'', lines:lines});
  await save(); closeDlg(); curBom=code; collapsed={}; vBoms(); vDash();
  toast(`已建立 BOM ${code}（${lines.length} 行）`);
}

/* ---------- 在 BOM 管理直接維護料號主檔 ---------- */
function masterAdd(){ editItem(''); }
let MDEL={q:'',sel:{}};
function masterDel(){
  MDEL={q:'',sel:{}};
  dialog('刪減料號主檔品號',`
    <div class="hint" style="margin-bottom:10px">仍被 BOM 引用的品號會顯示使用張數且無法勾選，
      需先在 BOM 編輯器移除該行才能刪除。</div>
    <div class="row" style="margin-bottom:10px"><div class="grow">
      <input type="search" id="mdq" placeholder="搜尋品號 / 品名 / 規格…"></div>
      <label class="mini"><input type="checkbox" id="mdOnlyFree" style="width:auto"
        onchange="mdRender()"> 只看未被 BOM 使用</label></div>
    <div id="mdList"></div>`,
    `<span class="mini" id="mdCnt" style="margin-right:auto"></span>
     <button class="btn danger" type="button" onclick="masterDelApply()">刪除所選</button>
     <button class="btn" value="x">取消</button>`);
  document.getElementById('mdq').oninput=e=>{MDEL.q=e.target.value;mdRender();
    const el=document.getElementById('mdq');el.focus();el.setSelectionRange(el.value.length,el.value.length);};
  mdRender();
}
function usageCount(code){
  return S.boms.filter(b=>b.lines.some(l=>l.code===code)).length;
}
function mdRender(){
  const q=MDEL.q.toLowerCase().trim();
  const onlyFree=document.getElementById('mdOnlyFree')?.checked;
  let rows=S.items.filter(i=>!q||`${i.code} ${i.name} ${i.spec}`.toLowerCase().includes(q))
    .map(i=>({...i,use:usageCount(i.code)}));
  if(onlyFree) rows=rows.filter(r=>!r.use);
  rows.sort((a,b)=>a.code.localeCompare(b.code));
  const show=rows.slice(0,300);
  document.getElementById('mdList').innerHTML=`<div class="tblwrap" style="max-height:44vh">
    <table class="grid"><thead><tr><th class="nos" style="width:40px"></th>
    <th class="nos">品號</th><th class="nos">品名</th><th class="nos num">庫存</th>
    <th class="nos num">單價</th><th class="nos">BOM 使用</th></tr></thead><tbody>
    ${show.map(i=>`<tr style="${i.use?'opacity:.6':'cursor:pointer'}"
        ${i.use?'':`onclick="mdTog('${esc(i.code)}')"`}>
      <td class="num">${i.use?'<span class="mut">🔒</span>':
        `<input type="checkbox" style="width:auto" ${MDEL.sel[i.code]?'checked':''}
          onclick="event.stopPropagation();mdTog('${esc(i.code)}')">`}</td>
      <td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td>
      <td class="num">${nf(i.stock)}</td><td class="num">${i.cost==null?'—':nf(i.cost)}</td>
      <td>${i.use?`<span class="tag bad">${i.use} 張 BOM</span>`:'<span class="tag ok">未使用</span>'}</td>
    </tr>`).join('')||'<tr><td colspan="6" class="empty">查無資料</td></tr>'}
    </tbody></table></div>
    ${rows.length>300?`<div class="hint">符合 ${rows.length} 筆，僅顯示前 300 筆</div>`:''}`;
  const n=Object.keys(MDEL.sel).filter(k=>MDEL.sel[k]).length;
  document.getElementById('mdCnt').textContent=`已選 ${n} 筆`;
}
function mdTog(code){
  if(usageCount(code)) return toast('此品號仍被 BOM 使用，無法刪除');
  MDEL.sel[code]=!MDEL.sel[code]; mdRender();
}
async function masterDelApply(){
  const codes=Object.keys(MDEL.sel).filter(k=>MDEL.sel[k]&&!usageCount(k));
  if(!codes.length) return toast('尚未選擇可刪除的品號');
  if(!confirm(`確定刪除 ${codes.length} 個料號主檔品號？`))return;
  const set=new Set(codes);
  S.items=S.items.filter(i=>!set.has(i.code));
  await save(); closeDlg(); vItems(); vBoms(); vDash(); setHdr();
  toast(`已刪除 ${codes.length} 個品號`);
}
async function importBomFile(){
  const f=await pickFile('.xlsx,.xls'); if(!f)return;
  const wb=await readWB(f); const bs=parseBoms(wb);
  if(!bs.length) return toast('未在檔案中找到可辨識的 BOM 工作表');
  let add=0,upd=0,fill=0;
  bs.forEach(b=>{const ix=S.boms.findIndex(x=>x.code===b.code);
    if(ix>=0){S.boms[ix]=b;upd++;}else{S.boms.push(b);add++;}
    b.lines.forEach(l=>{
      const ex=S.items.find(i=>i.code===l.code);
      if(!ex) S.items.push({code:l.code,name:l.name,spec:l.spec,unit:l.unit,
        stock:l._stock==null?0:l._stock, cost:l._cost==null?null:l._cost,
        safety:null,supplier:'',loc:'',lead:'',msb:'',
        note:'（BOM 匯入自動建檔，庫存與單價取自 BOM 表）'});
      else if((ex.cost==null||ex.cost==='')&&l._cost!=null){
        ex.cost=l._cost; fill++;
        ex.note=(ex.note?ex.note+'；':'')+`單價 ${l._cost} 取自 BOM 表`;}});
  });
  await save(); curBom=bs[0].code; vBoms(); vItems();
  toast(`匯入完成：新增 ${add} 張、更新 ${upd} 張 BOM`+(fill?`，回填 ${fill} 筆單價`:''));
}
</script>
<script>
/* ============================================================
   BOM 編輯器

let ED=null;
function editBom(code){

      <div style="width:220px"><div class="fld" style="margin:0"><label>產品品號 *</label>

        <input id="eb_spec" value="${esc(ED.spec)}"></div></div>

      階層 1 為產品直屬下階，階層 2 掛在上一個階層 1 之下，依此類推。
      若某行品號本身另有獨立 BOM 且未展開下階，展開時會自動引用該子 BOM。</div>
    <div id="edRows"></div>
    <div class="row" style="margin-top:10px">

      <button class="btn" type="button" onclick="edNewMasterItem()">＋ 新建料號主檔品號</button>
      <div class="grow"></div><span class="mini" id="edSum"></span></div>`,
    `<button class="btn pri" type="button" onclick="saveBom()">儲存 BOM</button>
     <button class="btn" value="x">取消</button>`);
  edRender();
}
function edRender(){
  const box=document.getElementById('edRows');
  const NOS=lineNos(ED.lines);
  box.innerHTML=`<div class="tblwrap" style="max-height:46vh"><table class="grid"><thead><tr>
    <th class="nos" style="width:74px">階層</th><th class="nos" style="width:112px">升降階</th>
    <th class="nos" style="width:210px">品號</th>
    <th class="nos">品名</th><th class="nos" style="width:92px">用量</th>
    <th class="nos" style="width:80px">單位</th><th class="nos" style="width:150px">備註</th>
    <th class="nos" style="width:96px"></th></tr></thead><tbody>
    ${ED.lines.map((l,i)=>{const it=itemOf(l.code);return `<tr>
      <td class="no ${l.level===1?'lv1':''}" style="padding-left:${9+(l.level-1)*14}px">${NOS[i]}</td>
      <td class="num"><button class="btn sm" onclick="edLv(${i},-1)">◀</button>
        <b style="padding:0 5px">L${l.level}</b>
        <button class="btn sm" onclick="edLv(${i},1)">▶</button></td>
      <td class="ac"><input class="mono" id="ac_${i}" value="${esc(l.code)}" autocomplete="off"
          oninput="edAC(${i})" onblur="setTimeout(()=>edACClose(${i}),180)"></td>
      <td class="mini" id="nm_${i}">${esc(l.name||it.name)}${it._ghost&&l.code?
        ` <span class="tag warn">未建檔</span> <button class="btn sm" onclick="edNewMasterItem('${esc(l.code)}',${i})">建檔</button>`:''}</td>
      <td><input type="number" step="any" value="${l.qty}" oninput="ED.lines[${i}].qty=parseFloat(this.value)||0;edSum()"></td>
      <td><input value="${esc(l.unit||it.unit||'pcs')}" oninput="ED.lines[${i}].unit=this.value"></td>
      <td><input value="${esc(l.note||'')}" oninput="ED.lines[${i}].note=this.value"></td>
      <td class="num"><button class="btn sm" onclick="edMv(${i},-1)">↑</button>
        <button class="btn sm" onclick="edMv(${i},1)">↓</button>
        <button class="btn sm danger" onclick="edDel(${i})">✕</button></td></tr>`}).join('')
    ||'<tr><td colspan="8" class="empty">尚無明細，點「新增一行」開始</td></tr>'}
  </tbody></table></div>`;
  edSum();
}
function edSum(){
  let cost=0,miss=0;
  ED.lines.forEach(l=>{const it=itemOf(l.code);
    if(!BIDX[l.code]&&!ED.lines.some(x=>x.level===l.level+1)){}
    if(it.cost==null)miss++; else cost+=it.cost*(+l.qty||0);});
  const el=document.getElementById('edSum');
  if(el) el.innerHTML=`共 ${ED.lines.length} 行　行項小計合計約 <b>${money(cost)}</b>（僅直接加總，未做階層去重；儲存後於 BOM 頁看正確展開成本）`;
}
function edAdd(){ED.lines.push({level:1,code:'',name:'',spec:'',qty:1,unit:'pcs',note:''});edRender();
  setTimeout(()=>document.getElementById('ac_'+(ED.lines.length-1))?.focus(),30);}
function edDel(i){ED.lines.splice(i,1);edRender();}
function edMv(i,d){const j=i+d;if(j<0||j>=ED.lines.length)return;
  [ED.lines[i],ED.lines[j]]=[ED.lines[j],ED.lines[i]];edRender();}
function edLv(i,d){ED.lines[i].level=Math.max(1,Math.min(9,ED.lines[i].level+d));edRender();}
function edACClose(i){document.getElementById('acl_'+i)?.remove();}
function edAC(i){
  const inp=document.getElementById('ac_'+i), q=inp.value.trim().toLowerCase();
  ED.lines[i].code=inp.value.trim();
  const it=IDX[ED.lines[i].code];
  if(it){ED.lines[i].name=it.name;ED.lines[i].unit=ED.lines[i].unit||it.unit;
    document.getElementById('nm_'+i).textContent=it.name;}
  edACClose(i); if(q.length<1)return;
  const hits=S.items.filter(x=>(x.code+' '+x.name+' '+x.spec).toLowerCase().includes(q)).slice(0,25);
  if(!hits.length)return;
  const d=document.createElement('div'); d.className='aclist'; d.id='acl_'+i;
  d.innerHTML=hits.map(h=>`<div onmousedown="edPick(${i},'${esc(h.code)}')">
    <span class="mono">${esc(h.code)}</span> ${esc(h.name)} <span class="mut">${esc(h.spec)}</span></div>`).join('');
  inp.parentNode.appendChild(d);
}
function edPick(i,code){
  const it=itemOf(code);
  ED.lines[i].code=code; ED.lines[i].name=it.name; ED.lines[i].spec=it.spec;
  ED.lines[i].unit=it.unit||'pcs'; edACClose(i); edRender();
}
/* ---------- 從料號主檔挑選品號加入 BOM ---------- */
let PICK={q:'',sel:{},lv:1};
function edPickFromMaster(){
  PICK={q:'',sel:{},lv:1};
  dialog2('從料號主檔挑選品號',`
    <div class="row" style="margin-bottom:10px">
      <div class="grow"><input type="search" id="pkq" placeholder="搜尋品號 / 品名 / 規格 / 供應商…"></div>
      <span class="mini">加入階層</span>
      <select id="pklv" style="width:90px" onchange="PICK.lv=+this.value">
        ${[1,2,3,4,5].map(n=>`<option value="${n}">L${n}</option>`).join('')}</select>
    </div>
    <div id="pkList"></div>`,
    `<span class="mini" id="pkCnt" style="margin-right:auto"></span>
     <button class="btn pri" type="button" onclick="edPickApply()">加入所選</button>
     <button class="btn" value="x">取消</button>`);
  document.getElementById('pkq').oninput=e=>{PICK.q=e.target.value;pkRender();
    const el=document.getElementById('pkq');el.focus();el.setSelectionRange(el.value.length,el.value.length);};
  pkRender();
}
function pkRender(){
  const q=PICK.q.toLowerCase().trim();
  const rows=S.items.filter(i=>!q||`${i.code} ${i.name} ${i.spec} ${i.supplier}`.toLowerCase().includes(q))
    .sort((a,b)=>a.code.localeCompare(b.code)).slice(0,300);
  document.getElementById('pkList').innerHTML=`<div class="tblwrap" style="max-height:46vh">
    <table class="grid"><thead><tr><th class="nos" style="width:40px"></th>
    <th class="nos">品號</th><th class="nos">品名</th><th class="nos">規格</th>
    <th class="nos num">庫存</th><th class="nos num">單價</th><th class="nos">供應商</th></tr></thead><tbody>
    ${rows.map(i=>`<tr onclick="pkTog('${esc(i.code)}')" style="cursor:pointer">
      <td class="num"><input type="checkbox" style="width:auto" ${PICK.sel[i.code]?'checked':''}

      <td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td><td class="mut">${esc(i.spec)}</td>
      <td class="num">${nf(i.stock)}</td><td class="num">${i.cost==null?'—':nf(i.cost)}</td>
      <td class="mut">${esc(i.supplier)}</td></tr>`).join('')

    ${rows.length>=300?'<div class="hint">僅顯示前 300 筆，請縮小搜尋範圍</div>':''}`;
  const n=Object.keys(PICK.sel).filter(k=>PICK.sel[k]).length;
  document.getElementById('pkCnt').textContent=`已選 ${n} 筆`;

function pkTog(code){PICK.sel[code]=!PICK.sel[code];pkRender();}
function edPickApply(){
  const codes=Object.keys(PICK.sel).filter(k=>PICK.sel[k]);
  if(!codes.length) return toast('尚未選擇品號');
  codes.forEach(c=>{const it=itemOf(c);
    ED.lines.push({level:PICK.lv,code:c,name:it.name,spec:it.spec,qty:1,unit:it.unit||'pcs',note:''});});

function edNewMasterItem(code,rowIx){
  const i={code:code||'',name:'',spec:'',unit:'pcs',stock:0,cost:null,safety:null,
           supplier:'',loc:'',lead:'',msb:'',note:''};
  const known=code?itemOf(code):null;
  if(known&&known._ghost){i.name=ED.lines[rowIx]?.name||'';i.spec=ED.lines[rowIx]?.spec||'';
    i.unit=ED.lines[rowIx]?.unit||'pcs';}
  dialog2(code?`建立料號主檔　${code}`:'新建料號主檔品號',
    itemForm(i,!code).replace(/id="if_/g,'id="jf_'),
    `<button class="btn pri" type="button" onclick="edSaveMasterItem(${rowIx==null?'null':rowIx})">建立並帶入</button>
     <button class="btn" value="x">取消</button>`);
  bindCodePicker('jf_',!code);
}
async function edSaveMasterItem(rowIx){
  const g=k=>document.getElementById('jf_'+k).value.trim();
  const gn=k=>{const v=g(k);return v===''?null:parseFloat(v);};
  const code=g('code'); if(!code) return toast('品號必填');
  const o={code,name:g('name'),spec:g('spec'),unit:g('unit')||'pcs',stock:gn('stock')||0,
    cost:gn('cost'),safety:gn('safety'),supplier:g('supplier'),loc:g('loc'),lead:g('lead'),
    msb:g('msb'),note:g('note')};
  const ix=S.items.findIndex(x=>x.code===code);
  if(ix>=0) S.items[ix]={...S.items[ix],...o}; else S.items.push(o);
  await save();
  if(rowIx!=null&&ED.lines[rowIx]){ED.lines[rowIx].code=code;ED.lines[rowIx].name=o.name;
    ED.lines[rowIx].spec=o.spec;ED.lines[rowIx].unit=o.unit;}
  else if(ED) ED.lines.push({level:1,code,name:o.name,spec:o.spec,qty:1,unit:o.unit,note:''});
  closeDlg2(); edRender(); vItems(); toast('已建立料號 '+code);
}
async function saveBom(){
  const code=document.getElementById('eb_code').value.trim();
  if(!code) return toast('產品品號必填');
  if(!ED.orig&&BIDX[code]) return toast('此品號已有 BOM');
  const lines=ED.lines.filter(l=>l.code);
  if(!lines.length) return toast('至少需要一行明細');
  if(lines[0].level!==1) lines[0].level=1;
  const bom={id:code,code,name:document.getElementById('eb_name').value.trim(),
    spec:document.getElementById('eb_spec').value.trim(),source:'網頁編輯',lines};
  lines.forEach(l=>{if(!IDX[l.code])S.items.push({code:l.code,name:l.name||'',spec:l.spec||'',
    unit:l.unit||'pcs',stock:0,cost:null,safety:null,supplier:'',loc:'',lead:'',msb:'',note:'（BOM 編輯自動建檔）'});});
  const ix=ED.orig?S.boms.findIndex(b=>b.code===ED.orig):-1;
  if(ix>=0)S.boms[ix]=bom; else S.boms.push(bom);
  await save(); closeDlg(); curBom=code; collapsed={}; vBoms(); toast('BOM 已儲存');
}

<script>

  }

  $('#v-mrp').innerHTML=`

      <span class="mini mut">成本規則</span>
      ${[['max','取較高者'],['buy','自身單價'],['sum','下階加總']]
        .map(([k,t])=>`<span class="chip ${costMode()===k?'on':''}" onclick="setCostMode('${k}')">${t}</span>`).join('')}
      <button class="btn pri" onclick="runMrp()">開始試算</button>
    </div>

function runMrp(){
  const leaf={}, subs={}, cycles=[];
  const pool={};
  ORD.forEach(o=>{
    if(!o.code||!(o.qty>0)) return;
    const ex=explodeShared(o.code,o.qty,OPT,pool);
    if(!ex)return;
    Object.entries(ex.leaf).forEach(([c,q])=>leaf[c]=(leaf[c]||0)+q);
    ex.sub.forEach(s=>{const k=s.code;
      subs[k]=subs[k]||{code:k,name:s.name,unit:s.unit,gross:0,fromStock:0,net:0};
      subs[k].gross+=s.gross;subs[k].fromStock+=s.fromStock;subs[k].net+=s.net;});
    cycles.push(...ex.cycles);
  });
  RES={leaf,subs:Object.values(subs),cycles,
       orders:ORD.filter(o=>o.code&&o.qty>0).map(o=>({...o,name:bomOf(o.code)?.name||''})),
       opt:{...OPT},ts:nowts()};
  renderMrp();
}
/* 多產品共用庫存池的展開 */
function explodeShared(bomCode,qty,opt,pool){
  const bom=bomOf(bomCode); if(!bom) return null;
  const leaf={},sub=[],cycles=[];
  const avail=c=>{if(!(c in pool))pool[c]=(itemOf(c).stock||0)-(opt.keepSafety?(itemOf(c).safety||0):0);
    return Math.max(0,pool[c]);};
  (function walk(nodes,mult,path,depth){
    nodes.forEach(n=>{
      const q=(+n.qty||0)*mult; if(q<=0)return;
      if(path.includes(n.code)){cycles.push(path.concat(n.code).join(' → '));return;}
      const {kids,ref}=kidsOf(n,path);
      if(kids.length){
        let need=q,used=0;
        if(opt.netting){const a=avail(n.code);used=Math.min(a,q);pool[n.code]-=used;need=q-used;}
        sub.push({code:n.code,name:n.name||itemOf(n.code).name,unit:n.unit||itemOf(n.code).unit,
                  gross:q,fromStock:used,net:need,depth,ref});
        if(need>0) walk(kids,need,path.concat(n.code),depth+1);
      }else leaf[n.code]=(leaf[n.code]||0)+q;
    });
  })(buildTree(bom),qty,[bomCode],1);
  return {leaf,sub,cycles};
}
function mrpRows(){
  return Object.entries(RES.leaf).map(([code,need])=>{
    const i=itemOf(code);
    const avail=(i.stock||0)-(RES.opt.keepSafety?(i.safety||0):0);
    const gap=need-Math.max(0,avail);
    return {code,name:i.name,spec:i.spec,unit:i.unit,need,stock:i.stock||0,safety:i.safety||0,
      avail:Math.max(0,avail),gap:Math.max(0,gap),cost:i.cost,supplier:i.supplier,lead:i.lead,
      needVal:(i.cost||0)*need, shortVal:(i.cost||0)*Math.max(0,gap),
      ok:gap<=0, ghost:!!i._ghost||i.cost==null};
  });
}

function eqv(a,b){
  const an=a==null||a===''; const bn=b==null||b==='';
  if(an&&bn) return true;
  if(typeof a==='number'||typeof b==='number'){
    const x=parseFloat(a),y=parseFloat(b);
    if(!isNaN(x)&&!isNaN(y)) return Math.abs(x-y)<1e-6;
  }
  const norm=v=>String(v).replace(/\r\n?/g,'\n').replace(/[ \t]+/g,' ').trim();
  return norm(a)===norm(b);
}
function diffItems(oldArr,newArr){
  const O={},N={}; oldArr.forEach(i=>O[i.code]=i); newArr.forEach(i=>N[i.code]=i);
  const added=[],removed=[],stock=[],cost=[],other=[];
  Object.keys(N).forEach(c=>{ if(!O[c]) added.push(N[c]); });
  Object.keys(O).forEach(c=>{ if(!N[c]) removed.push(O[c]); });
  Object.keys(N).forEach(c=>{
    const o=O[c],n=N[c]; if(!o)return;
    if(!eqv(o.stock,n.stock)) stock.push({code:c,name:n.name,unit:n.unit,
      from:o.stock||0,to:n.stock||0,delta:(n.stock||0)-(o.stock||0)});
    if(!eqv(o.cost,n.cost)) cost.push({code:c,name:n.name,from:o.cost,to:n.cost,
      delta:(n.cost==null||o.cost==null)?null:n.cost-o.cost});
    FIELDS.forEach(([k,l])=>{ if(k==='stock'||k==='cost')return;
      if(!eqv(o[k],n[k])) other.push({code:c,name:n.name,field:l,from:o[k],to:n[k]}); });
  });
  return {added,removed,stock,cost,other,
    sum:{added:added.length,removed:removed.length,stock:stock.length,cost:cost.length,other:other.length}};
}

async function applySync(){
