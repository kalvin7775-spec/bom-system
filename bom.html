  const N={}; PEND.items.forEach(i=>N[i.code]=i);
  const merged=[];
  PEND.items.forEach(i=>merged.push(i));
  S.items.forEach(o=>{ if(N[o.code]) return;
    const used=whereUsed(o.code).length;
    if(keep||used) merged.push({...o,note:(o.note?o.note+'；':'')+`新版總表已無此料號(${new Date().toLocaleDateString('zh-TW')})`+(used?`，仍被 ${used} 張 BOM 使用`:'')});
  });
  S.items=merged;
  S.history.unshift({ts:nowts(),file:PEND.file,sum:PEND.diff.sum,diff:PEND.diff});
  S.history=S.history.slice(0,50);
  S.meta.itemFile=PEND.file; S.meta.updatedAt=nowts();
  PEND=null;
  await save(); vSync(); vItems(); vDash(); setHdr();
  toast('已套用更新');
}
function exportDiff(){
  const d=CURDIFF||(PEND?PEND.diff:null); if(!d)return;

    ['新增',d.added.map(r=>({品號:r.code,品名:r.name,規格:r.spec,庫存:r.stock,單價:r.cost,供應商:r.supplier}))],
    ['消失',d.removed.map(r=>({品號:r.code,品名:r.name,原庫存:r.stock,被BOM使用張數:whereUsed(r.code).length}))],

    ['其他異動',d.other.map(r=>({品號:r.code,品名:r.name,欄位:r.field,原值:r.from,新值:r.to}))]
  ],`料號差異報表_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.xlsx`);
}
function showHistory(i){

<script>
/* ============================================================
   三張式資料庫（料號主檔 / BOM主檔 / BOM明細）
   ============================================================ */
const DBSHEET={items:'料號主檔',boms:'BOM主檔',lines:'BOM明細'};

function dbRows(){
  const items=S.items.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(i=>({
    品號:i.code,品名:i.name||'',規格:i.spec||'',單位:i.unit||'pcs',
    庫存數量:i.stock==null?0:i.stock,單位成本:i.cost==null?'':i.cost,
    安全庫存:i.safety==null?'':i.safety,供應商:i.supplier||'',交期:i.lead||'',
    儲位:i.loc||'',MSB:i.msb||'',備註:i.note||''}));
  const boms=S.boms.map(b=>({BOM品號:b.code,產品名稱:b.name||'',規格:b.spec||'',
    明細行數:b.lines.length,來源:b.source||'',備註:b.note||''}));
  const lines=[];
  S.boms.forEach(b=>{const nos=lineNos(b.lines);
    b.lines.forEach((l,i)=>lines.push({BOM品號:b.code,項次:i+1,階層編號:nos[i],階層:l.level,
      品號:l.code,品名:l.name||itemOf(l.code).name||'',規格:l.spec||'',
      用量:l.qty,單位:l.unit||'pcs',備註:l.note||''}));});
  return {items,boms,lines};
}
function exportDB(){
  const r=dbRows();
  const readme=[
    {欄位:'說明',內容:'本檔為 BOM 管理系統的資料庫格式，共三張表，可直接用 Excel 維護後整份上傳回系統。'},
    {欄位:DBSHEET.items,內容:'料號主檔。主鍵＝品號，不可重複、不可空白。'},
    {欄位:DBSHEET.boms, 內容:'BOM 主檔。主鍵＝BOM品號，一張 BOM 一列。「明細行數」為系統輸出參考值，上傳時忽略。'},
    {欄位:DBSHEET.lines,內容:'BOM 明細。以「BOM品號」對應 BOM 主檔，以「品號」對應料號主檔；同一張 BOM 依「項次」排序。'},
    {欄位:'階層',內容:'1＝產品直屬下階，2＝掛在上一個階層 1 之下，依此類推。「階層編號」由系統自動重算，上傳時忽略。'},
    {欄位:'用量',內容:'該行相對於「上一階父件一個」的用量。'},
    {欄位:'上傳',內容:'系統→資料管理→「上傳資料庫 Excel」。上傳前會先顯示差異摘要再確認。'},
    {欄位:'新增料號',內容:'在料號主檔新增一列即可；BOM 明細中出現但主檔沒有的品號，上傳時會自動補建並註記。'},
    {欄位:'刪除料號',內容:'從料號主檔移除該列；若仍被 BOM 明細引用，系統會保留並提示。'}
  ];
  xlsxOut([['說明',readme],[DBSHEET.items,r.items],[DBSHEET.boms,r.boms],[DBSHEET.lines,r.lines]],
    `BOM資料庫_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.xlsx`);
}
/* 由三張表解析出 items / boms */
function parseDB(wb){
  const get=n=>{const k=wb.SheetNames.find(x=>x.trim()===n)||wb.SheetNames.find(x=>x.includes(n));
    return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:null}):null;};
  const si=get(DBSHEET.items), sb=get(DBSHEET.boms), sl=get(DBSHEET.lines);
  if(!si||!sl) return {error:`找不到必要的工作表（需要「${DBSHEET.items}」與「${DBSHEET.lines}」）`};
  const items=[],seen={},dups=[];
  si.forEach(r=>{const code=S_(r['品號']);
    if(!code) return;
    if(seen[code]){dups.push(code);return;}
    seen[code]=1;
    items.push({code,name:S_(r['品名']),spec:S_(r['規格']),unit:S_(r['單位'])||'pcs',
      stock:N_(r['庫存數量'])||0,cost:N_(r['單位成本']),safety:N_(r['安全庫存']),
      supplier:S_(r['供應商']),lead:S_(r['交期']),loc:S_(r['儲位']),msb:S_(r['MSB']),note:S_(r['備註'])});});
  const meta={};
  (sb||[]).forEach(r=>{const c=S_(r['BOM品號']); if(c) meta[c]={name:S_(r['產品名稱']),spec:S_(r['規格']),
    source:S_(r['來源'])||'資料庫上傳',note:S_(r['備註'])};});
  const grp={},order=[],badQty=[];
  sl.forEach((r,ri)=>{
    const bc=S_(r['BOM品號']), code=S_(r['品號']);
    if(!bc||!code) return;
    if(!grp[bc]){grp[bc]=[];order.push(bc);}
    const q=N_(r['用量']); if(q==null) badQty.push(`${bc} / ${code}`);
    grp[bc].push({_seq:N_(r['項次'])!=null?N_(r['項次']):ri,
      level:Math.max(1,N_(r['階層'])||1),code,name:S_(r['品名']),spec:S_(r['規格']),
      qty:q==null?1:q,unit:S_(r['單位'])||'pcs',note:S_(r['備註'])});});
  const boms=order.map(bc=>{
    const ls=grp[bc].sort((a,b)=>a._seq-b._seq).map(({_seq,...x})=>x);
    const m=meta[bc]||{};
    return {id:bc,code:bc,name:m.name||itemOf(bc).name||'',spec:m.spec||'',
      source:m.source||'資料庫上傳',note:m.note||'',lines:ls};});
  const known=new Set(items.map(i=>i.code)), auto=[];
  boms.forEach(b=>b.lines.forEach(l=>{
    if(!known.has(l.code)){known.add(l.code);auto.push(l.code);
      items.push({code:l.code,name:l.name,spec:l.spec,unit:l.unit,stock:0,cost:null,safety:null,
        supplier:'',lead:'',loc:'',msb:'',note:'（BOM 明細帶入，主檔未列）'});}}));
  return {items,boms,warn:{dups,badQty,auto}};
}
function bomDiff(oldB,newB){
  const O={},N={}; oldB.forEach(b=>O[b.code]=b); newB.forEach(b=>N[b.code]=b);
  const added=[],removed=[],changed=[];
  newB.forEach(b=>{ if(!O[b.code]) added.push(b);
    else{const a=O[b.code];
      const sig=x=>x.lines.map(l=>`${l.level}|${l.code}|${l.qty}|${l.unit}`).join(';');
      if(sig(a)!==sig(b)||a.name!==b.name)
        changed.push({code:b.code,name:b.name,from:a.lines.length,to:b.lines.length});}});
  oldB.forEach(b=>{ if(!N[b.code]) removed.push(b); });
  return {added,removed,changed};
}
let DBPEND=null;
/* 自動辨識上傳的 Excel 屬於哪一種格式 */
function detectFormat(wb){
  const names=wb.SheetNames.map(n=>n.trim());
  const has=n=>names.some(x=>x===n||x.includes(n));
  if(has(DBSHEET.items)&&has(DBSHEET.lines)) return 'db';
  const bs=parseBoms(wb);
  const its=parseItems(wb);
  if(bs.length&&its.length&&its.length>bs.length*3) return 'both';
  if(bs.length) return 'bom';
  if(its.length) return 'items';
  return null;
}
async function importDB(){
  const f=await pickFile('.xlsx,.xls'); if(!f) return;
  let wb;
  try{wb=await readWB(f);}
  catch(e){return dialog('檔案讀取失敗',
    `<p>無法讀取 <b>${esc(f.name)}</b>。</p>
     <div class="hint">請確認檔案是 .xlsx 或 .xls，且沒有被 Excel 開著或設密碼保護。</div>`);}
  const kind=detectFormat(wb);
  if(kind==='items'||kind==='bom'||kind==='both') return importLoose(f,wb,kind);
  if(kind!=='db') return dialog('無法辨識檔案格式',
    `<p>在 <b>${esc(f.name)}</b> 裡找不到可辨識的資料。工作表：${wb.SheetNames.map(esc).join('、')}</p>
     <div class="hint">系統可接受三種檔案：<br>
       1. <b>資料庫檔</b> — 含「料號主檔」「BOM主檔」「BOM明細」三張表<br>
       2. <b>料號總表</b> — 需有「品號」欄位的表<br>
       3. <b>BOM 檔</b> — 每張工作表含「品號 / 產品名稱」標頭與「項次 / 階層」欄位</div>`);
  const p=parseDB(wb);
  if(p.error) return dialog('資料庫檔格式不符',`<p>${esc(p.error)}</p>`);
  const di=diffItems(S.items,p.items), db=bomDiff(S.boms,p.boms);
  DBPEND={file:f.name,...p,di,db};
  const W=p.warn;
  dialog('上傳資料庫 — 差異確認',`
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><div class="k">料號（檔案）</div><div class="v">${p.items.length}</div></div>
      <div class="stat ok"><div class="k">料號新增</div><div class="v">${di.sum.added}</div></div>
      <div class="stat bad"><div class="k">料號消失</div><div class="v">${di.sum.removed}</div></div>
      <div class="stat"><div class="k">庫存／單價變動</div><div class="v">${di.sum.stock}／${di.sum.cost}</div></div>
      <div class="stat"><div class="k">BOM（檔案）</div><div class="v">${p.boms.length}</div></div>
      <div class="stat warn"><div class="k">BOM 新增／異動／移除</div><div class="v" style="font-size:17px">${db.added.length}／${db.changed.length}／${db.removed.length}</div></div>
    </div>
    ${(W.dups.length||W.badQty.length||W.auto.length)?`<div class="card" style="border-color:#e8c98f">
      <b style="color:var(--warn)">提醒</b><div class="hint">
      ${W.dups.length?`料號主檔有重複品號 ${W.dups.length} 筆（只取第一筆）：${W.dups.slice(0,8).map(esc).join('、')}<br>`:''}
      ${W.badQty.length?`BOM 明細有 ${W.badQty.length} 行未填用量，已當作 1：${W.badQty.slice(0,5).map(esc).join('、')}<br>`:''}
      ${W.auto.length?`BOM 明細用到但主檔未列的品號 ${W.auto.length} 個，已自動補建：${W.auto.slice(0,8).map(esc).join('、')}`:''}
      </div></div>`:''}
    ${db.added.length?`<div class="dgroup"><h3>新增 BOM <span class="tag ok">${db.added.length}</span></h3>
      <div class="mini">${db.added.map(b=>esc(b.code)+' '+esc(b.name)).join('　／　')}</div></div>`:''}
    ${db.changed.length?`<div class="dgroup"><h3>明細有異動的 BOM <span class="tag warn">${db.changed.length}</span></h3>
      <div class="tblwrap" style="max-height:200px"><table class="grid"><thead><tr>
      <th class="nos">BOM 品號</th><th class="nos">產品名稱</th><th class="nos num">原行數</th><th class="nos num">新行數</th>
      </tr></thead><tbody>${db.changed.map(c=>`<tr><td class="mono">${esc(c.code)}</td>
      <td>${esc(c.name)}</td><td class="num mut">${c.from}</td><td class="num"><b>${c.to}</b></td></tr>`).join('')}
      </tbody></table></div></div>`:''}
    ${db.removed.length?`<div class="dgroup"><h3>檔案中不存在的 BOM <span class="tag bad">${db.removed.length}</span></h3>
      <div class="mini">${db.removed.map(b=>esc(b.code)).join('、')}　→ 套用後將被移除</div></div>`:''}
    <div class="dgroup">${diffHTML(di,f.name,p.items.length)}</div>`,
    `<button class="btn pri" type="button" onclick="applyDB()">確認套用</button>
     <button class="btn" value="x">取消</button>`);
}
/* 直接匯入原始的料號總表 / BOM 檔 */
let LOOSE=null;
function importLoose(f,wb,kind){
  const its=(kind==='bom')?[]:parseItems(wb);
  const bs =(kind==='items')?[]:parseBoms(wb);
  const newIts=its.filter(i=>!IDX[i.code]).length, updIts=its.length-newIts;
  const newBs=bs.filter(b=>!BIDX[b.code]).length, updBs=bs.length-newBs;
  const autoCodes=[], willFill=[];
  const known=new Set(S.items.map(i=>i.code).concat(its.map(i=>i.code)));
  const costOf=c=>{const n=its.find(i=>i.code===c); if(n) return n.cost;
    const o=IDX[c]; return o?o.cost:undefined;};
  bs.forEach(b=>b.lines.forEach(l=>{
    if(!known.has(l.code)){known.add(l.code);autoCodes.push(l.code);}
    else{const cur=costOf(l.code);
      if((cur==null||cur==='')&&l._cost!=null) willFill.push(l.code+' → '+l._cost);}}));
  LOOSE={file:f.name,items:its,boms:bs,autoCodes};
  dialog('匯入 '+f.name,`
    <div class="hint" style="margin-bottom:12px">系統判斷這是
      <b>${kind==='items'?'料號總表':kind==='bom'?'BOM 檔':'料號總表 ＋ BOM 檔'}</b>，
      將以<b>新增與更新</b>的方式併入現有資料（不會刪除任何既有料號或 BOM）。</div>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat ok"><div class="k">料號新增</div><div class="v">${newIts}</div></div>
      <div class="stat"><div class="k">料號更新</div><div class="v">${updIts}</div></div>
      <div class="stat ok"><div class="k">BOM 新增</div><div class="v">${newBs}</div></div>
      <div class="stat"><div class="k">BOM 更新</div><div class="v">${updBs}</div></div>
      <div class="stat ${autoCodes.length?'warn':''}"><div class="k">自動建檔料號</div><div class="v">${autoCodes.length}</div></div>
      <div class="stat ${willFill.length?'warn':''}"><div class="k">回填單價</div><div class="v">${willFill.length}</div></div>
    </div>
    ${willFill.length?`<div class="card" style="border-color:#e8c98f"><b style="color:var(--warn)">將回填單價</b>
      <div class="hint">下列料號在料號總表沒有單價，但 BOM 表上有標價，匯入時會補進料號主檔
        （不會覆蓋已有的價格）：<br>${willFill.map(esc).join('<br>')}</div></div>`:''}
    ${bs.length?`<div class="dgroup"><h3>BOM</h3><div class="tblwrap" style="max-height:200px">
      <table class="grid"><thead><tr><th class="nos">品號</th><th class="nos">產品名稱</th>
      <th class="nos num">明細行數</th><th class="nos">狀態</th></tr></thead><tbody>
      ${bs.map(b=>`<tr><td class="mono">${esc(b.code)}</td><td>${esc(b.name)}</td>
        <td class="num">${b.lines.length}</td>
        <td><span class="tag ${BIDX[b.code]?'info':'ok'}">${BIDX[b.code]?'更新':'新增'}</span></td></tr>`).join('')}
      </tbody></table></div></div>`:''}
    ${its.length?`<div class="dgroup"><h3>料號（前 10 筆）</h3><div class="tblwrap" style="max-height:200px">
      <table class="grid"><thead><tr><th class="nos">品號</th><th class="nos">品名</th>
      <th class="nos num">庫存</th><th class="nos num">單價</th></tr></thead><tbody>
      ${its.slice(0,10).map(i=>`<tr><td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td>
        <td class="num">${nf(i.stock)}</td><td class="num">${i.cost==null?'—':nf(i.cost)}</td></tr>`).join('')}
      </tbody></table><div class="hint">共 ${its.length} 筆</div></div></div>`:''}
    ${autoCodes.length?`<div class="hint">BOM 用到但料號總表沒有的品號，會自動建檔
      （庫存與單價若 BOM 表上有填會一併帶入）：
      ${autoCodes.slice(0,10).map(esc).join('、')}${autoCodes.length>10?' …':''}</div>`:''}`,
    `<button class="btn pri" type="button" onclick="applyLoose()">確認匯入</button>
     <button class="btn" value="x">取消</button>`);
}
async function applyLoose(){
  if(!LOOSE) return;
  let a=0,u=0;
  LOOSE.items.forEach(r=>{const ix=S.items.findIndex(i=>i.code===r.code);
    if(ix>=0){S.items[ix]={...S.items[ix],...r};u++;}else{S.items.push(r);a++;}});
  let ba=0,bu=0, filled=[];
  LOOSE.boms.forEach(b=>{const ix=S.boms.findIndex(x=>x.code===b.code);
    if(ix>=0){S.boms[ix]=b;bu++;}else{S.boms.push(b);ba++;}
    b.lines.forEach(l=>{
      const ex=S.items.find(i=>i.code===l.code);
      if(!ex){
        S.items.push({code:l.code,name:l.name||'',spec:l.spec||'',unit:l.unit||'pcs',
          stock:l._stock==null?0:l._stock, cost:l._cost==null?null:l._cost,
          safety:null,supplier:'',lead:'',loc:'',msb:'',
          note:'（BOM 匯入自動建檔，庫存與單價取自 BOM 表）'});
      }else if((ex.cost==null||ex.cost==='')&&l._cost!=null){
        /* 料號主檔沒有單價、但 BOM 表上有標價 → 回填，避免成本少算 */
        ex.cost=l._cost;
        ex.note=(ex.note?ex.note+'；':'')+`單價 ${l._cost} 取自 BOM 表`;
        filled.push(l.code);
      }});});
  LOOSE.filled=filled;
  S.meta.itemFile=S.meta.itemFile||LOOSE.file;
  if(LOOSE.boms.length) S.meta.bomFile=LOOSE.file;
  S.meta.updatedAt=nowts();
  const f=LOOSE.file, nf2=filled.length; LOOSE=null; curBom=null; RES=null;
  await save(); closeDlg(); renderAll();
  toast(`${f} 匯入完成：料號 +${a}/更新 ${u}，BOM +${ba}/更新 ${bu}`+
        (nf2?`，回填 ${nf2} 筆單價`:''));
}
async function applyDB(){
  if(!DBPEND) return;
  const keep=[];
  const N={}; DBPEND.items.forEach(i=>N[i.code]=i);
  S.items.forEach(o=>{ if(!N[o.code]) keep.push(o.code); });
  S.items=DBPEND.items;
  S.boms=DBPEND.boms;
  S.history.unshift({ts:nowts(),file:DBPEND.file+'（資料庫上傳）',sum:DBPEND.di.sum,diff:DBPEND.di});
  S.history=S.history.slice(0,50);
  S.meta.itemFile=DBPEND.file; S.meta.bomFile=DBPEND.file; S.meta.updatedAt=nowts();
  DBPEND=null; curBom=null; RES=null;
  await save(); closeDlg(); renderAll();
  toast('資料庫已套用'+(keep.length?`（移除 ${keep.length} 筆舊料號）`:''));
}
</script>
<script>
/* ============================================================
   庫存異動 — 入庫／領料／退料單
   流程：料號或 BOM 列上按「異動」把品號加進待送出單據 → 填單頭 → 送出
         送出時由後端配單號 PPYYMM###、即時加減庫存、寫入「庫存異動」工作表
   ============================================================ */
const DRAFTKEY='bom_draft_v2';
const MOVE_TYPES=['入庫','領料','退料'];
const HOUSES=['研發倉','物料倉','成品倉'];
const DEPTS=['製造部','業務部','研發部','品保部','管理部'];
const MAX_LINES=24;              /* Word 模板固定 24 列，一張單最多 24 個品項 */

/* 人員部門對照：依「領料單系統規範」，申請部門由「人員」決定，與用途無關 */
function staffList(){ return (S && S.staff) || []; }
function deptOf(name){
  const n=String(name||'').trim(); if(!n) return '';
  const hit=staffList().find(x=>x.name===n||x.alias===n);
  return hit?hit.dept:'';
}
function fullNameOf(name){
  const n=String(name||'').trim();
  const hit=staffList().find(x=>x.name===n||x.alias===n);
  return hit?hit.name:n;
}
const todayStr=()=>{const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function blankDraft(){ return {type:'領料',house:'物料倉',dept:'',reason:'',
  taker:'',memo:'',date:todayStr(),lines:[]}; }
/* 申請部門依填表人（登入者）自動帶出，使用者仍可自行改 */
function autoDept(){
  if(MVORD.dept) return MVORD.dept;
  const d=deptOf((ME&&ME.name)||WHO||'');
  if(d){ MVORD.dept=d; saveDraft(); }
  return d;
}
let MVORD=(()=>{ try{ const o=JSON.parse(LS.get(DRAFTKEY)); if(o&&Array.isArray(o.lines)) return o; }catch(e){}
  return blankDraft(); })();
function saveDraft(){ LS.set(DRAFTKEY,JSON.stringify(MVORD)); paintMoveBadge(); }
function paintMoveBadge(){ const b=document.getElementById('moveBadge');
  if(b) b.textContent = MVORD.lines.length ? String(MVORD.lines.length) : ''; }

/* ---------- 從料號主檔 / BOM 樹狀表加入單據 ---------- */
function addMove(code){
  const i=itemOf(code);
  const ex=MVORD.lines.find(l=>l.code===code);
  dialog(`加入異動單　${code}`,`
    <div class="mini mut" style="margin-bottom:10px">${esc(i.name||'')}${i.spec?'　'+esc(i.spec):''}
      　目前庫存 <b>${nf(i.stock)}</b> ${esc(i.unit||'')}</div>
    <div class="fld"><label>類別（整張單同一種）</label>
      <select id="mv_type">${MOVE_TYPES.map(t=>`<option value="${t}"${MVORD.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>數量</label><input id="mv_qty" type="number" min="0" step="any" value="${ex?ex.qty:1}"></div>
    <div class="fld"><label>異動原因／用途（整張單共用）</label>
      <input id="mv_reason" value="${esc(MVORD.reason)}" placeholder="例：研發領料_耳鏡測試裸板"></div>
    <div class="fld"><label>本行備註<span class="mini mut">（只存系統紀錄，依規範不印在 Word 單上）</span></label>
      <input id="mv_note" value="${esc(ex?ex.note:'')}"></div>
    <div class="hint">${ex?'這個品號已在單據裡，確定後會更新數量。':'加入後可在「庫存異動」分頁補其他欄位，整張單一起送出。'}</div>`,
    `<button class="btn pri" type="button" onclick="doAddMove('${esc(code)}')">加入單據</button>
     <button class="btn" value="x">取消</button>`);
  setTimeout(()=>{const q=document.getElementById('mv_qty'); if(q){q.focus();q.select();}},80);
}
function doAddMove(code){
  const qty=parseFloat(document.getElementById('mv_qty').value);
  if(!(qty>0)) return toast('數量要大於 0');
  MVORD.type=document.getElementById('mv_type').value;
  MVORD.reason=document.getElementById('mv_reason').value.trim();
  const note=document.getElementById('mv_note').value.trim();
  const i=itemOf(code);
  const ex=MVORD.lines.find(l=>l.code===code);
  if(ex){ ex.qty=qty; ex.note=note; }
  else MVORD.lines.push({code:code,name:i.name||'',unit:i.unit||'pcs',qty:qty,note:note});
  saveDraft(); closeDlg(); vMove();
  toast(`已加入單據（共 ${MVORD.lines.length} 項）`);
}
function mvDel(ix){ MVORD.lines.splice(ix,1); saveDraft(); vMove(); }
function mvQty(ix,v){ const n=parseFloat(v); MVORD.lines[ix].qty=isNaN(n)?0:n; saveDraft(); vMoveSummary(); }
function mvNote(ix,v){ MVORD.lines[ix].note=v; saveDraft(); }
function mvHead(k,v){ MVORD[k]=v; saveDraft(); if(k==='type') vMove(); else vMoveSummary(); }
function mvClear(){
  if(!MVORD.lines.length) return;
  dialog('清空單據',`<p>確定要清掉這張還沒送出的單據（${MVORD.lines.length} 項）嗎？</p>
    <div class="hint">已送出的單據不受影響。</div>`,
    `<button class="btn danger" type="button" onclick="closeDlg();doMvClear()">確定清空</button>
     <button class="btn" value="x">取消</button>`);
}
function doMvClear(){ MVORD=blankDraft(); saveDraft(); vMove(); toast('已清空'); }

/* ---------- 送出 ---------- */
function mvSubmit(){
  /* 依「領料單系統規範」第七節逐項檢查必填 */
  if(!MVORD.lines.length) return toast('單據沒有明細');
  if(!MVORD.reason.trim()) return toast('請填「異動原因」，會印在 Word 單的表頭');
  if(!MVORD.date) return toast('請填日期');
  if(!MVORD.house) return toast('請選倉別');
  if(!autoDept()) return toast('請選申請部門（依填表人所屬部門）');
  const bad=MVORD.lines.filter(l=>!(l.qty>0));
  if(bad.length) return toast('有 '+bad.length+' 行數量沒填或不是正數');
  const send=MVORD.lines.slice(0,MAX_LINES), rest=MVORD.lines.slice(MAX_LINES);
  const frac=send.filter(l=>!Number.isInteger(+l.qty));
  const neg = MVORD.type==='領料'
    ? send.filter(l=>(itemOf(l.code).stock||0) < l.qty) : [];
  dialog('送出單據',`
    <dl class="kv">
      <dt>類別</dt><dd><b>${esc(MVORD.type)}</b>　${esc(MVORD.house)}</dd>
      <dt>日期</dt><dd>${esc(MVORD.date)}</dd>
      <dt>申請部門</dt><dd>${esc(MVORD.dept)}　<span class="mini mut">填表人 ${esc((ME&&ME.name)||WHO||'')}</span></dd>
      <dt>異動原因</dt><dd>${esc(MVORD.reason)}</dd>
      <dt>明細</dt><dd>${send.length} 項，共 ${nf(send.reduce((s,l)=>s+(+l.qty||0),0))} 個</dd>
    </dl>
    ${rest.length?`<div class="ro-banner" style="margin-top:12px">這張單會送出<b>前 ${MAX_LINES} 項</b>，
      剩下的 ${rest.length} 項留在待送出區，之後再開一張新單（新的流水號）。</div>`:''}
    ${frac.length?`<div class="ro-banner" style="margin-top:12px">下列數量不是整數，確認是以重量或長度計價的料件再送出：
      ${frac.map(l=>esc(l.code)+' × '+nf(l.qty)).join('、')}</div>`:''}
    ${neg.length?`<div class="ro-banner" style="margin-top:12px">下列 ${neg.length} 項領用量大於現有庫存，送出後庫存會變成負數：<br>
      ${neg.map(l=>esc(l.code)+'（庫存 '+nf(itemOf(l.code).stock)+'，領 '+nf(l.qty)+'）').join('、')}</div>`:''}
    <div class="hint">送出後會取得單號、即時加減庫存並寫入紀錄，之後可隨時重新下載 Word 單。單據內容不能再改，打錯只能用反向的單沖銷。</div>`,
    `<button class="btn pri" type="button" onclick="doMvSubmit()">確定送出</button>
     <button class="btn" value="x">再檢查一下</button>`);
}
async function doMvSubmit(){
  if(!CLOUD) return toast('本機模式無法送出單據，請使用線上版');
  closeDlg();
  const rest=MVORD.lines.slice(MAX_LINES);
  const snapshot=JSON.parse(JSON.stringify(
    Object.assign({},MVORD,{lines:MVORD.lines.slice(0,MAX_LINES)})));
  setNet('save');
  try{
    const d=await apiPost('postOrder',null,{order:snapshot});
    if(d.error){ setNet('err');
      if(d.needLogin) return openGate('login',d.error);
      return dialog('送出失敗',`<p>${esc(d.error)}</p>
        <div class="hint">單據還留著，修正後可以再送一次。</div>`); }
    /* 超過 24 項的部分留在待送出區，之後另開一張流水號 */
    MVORD=Object.assign(blankDraft(),
      rest.length?{type:snapshot.type,house:snapshot.house,dept:snapshot.dept,
                   reason:snapshot.reason,taker:snapshot.taker,memo:snapshot.memo,
                   date:snapshot.date,lines:rest}:{});
    saveDraft();
    await pull(); renderAll();
    const posted=Object.assign({},snapshot,{no:d.no,date:d.date,by:(ME&&ME.name)||WHO||''});
    go('move');
    dialog(`單據已送出　${d.no}`,`
      <p>庫存已更新，紀錄寫進試算表的「庫存異動」工作表。</p>
      <dl class="kv"><dt>單號</dt><dd><b>${esc(d.no)}</b></dd>
        <dt>類別</dt><dd>${esc(snapshot.type)}　${esc(snapshot.house)}</dd>
        <dt>申請部門</dt><dd>${esc(snapshot.dept)}</dd>
        <dt>異動原因</dt><dd>${esc(snapshot.reason)}</dd>
        <dt>異動後庫存</dt><dd>${(d.stock||[]).map(x=>esc(x.code)+' → '+nf(x.stock)).join('<br>')}</dd></dl>
      ${rest.length?`<div class="ro-banner">還有 ${rest.length} 項留在待送出區，請再送一次開下一張單。</div>`:''}`,
      `<button class="btn pri" type="button" onclick="docFromOrder(${esc(JSON.stringify(posted)).replace(/"/g,'&quot;')})">下載 Word 單</button>
       <button class="btn" value="x">關閉</button>`);
  }catch(e){ setNet('err');
    dialog('送不出去',`<p>連不上雲端：${esc(e.message||'網路逾時')}</p>
      <div class="hint">單據還留著。確認網路後再按一次送出即可，系統不會重複扣帳。</div>`); }
}

/* ---------- 歷史單據 ---------- */
const moveSt={q:'',type:'',open:'',ym:''};
/* 把逐列紀錄依單號組成一張張單 */
function moveOrders(){
  const g={}, order=[];
  (S.moves||[]).forEach(m=>{
    if(!g[m.no]){ g[m.no]={no:m.no,date:m.date,type:m.type,house:m.house,dept:m.dept,
      reason:m.reason,taker:m.taker,by:m.by,memo:m.memo,at:m.at,lines:[]}; order.push(m.no); }
    g[m.no].lines.push(m);
  });
  let list=order.map(n=>g[n]).reverse();
  if(moveSt.type) list=list.filter(o=>o.type===moveSt.type);
  if(moveSt.ym)   list=list.filter(o=>ymOf(o.date)===moveSt.ym);
  const q=moveSt.q.trim().toLowerCase();
  if(q) list=list.filter(o=>[o.no,o.reason,o.taker,o.by,o.house].join(' ').toLowerCase().includes(q)
    || o.lines.some(l=>(l.code+' '+l.name).toLowerCase().includes(q)));
  return list;
}
function vMove(){

  const canW=canWrite();
  const sum=MVORD.lines.reduce((s,l)=>s+(+l.qty||0),0);
  const dept=autoDept();
  const over=MVORD.lines.length-MAX_LINES;
  const filler=(ME&&ME.name)||WHO||'';
  const draft=`
  <div class="card" style="border-color:${MVORD.lines.length?'var(--acc)':'var(--line)'}">
    <h2>待送出單據 <span class="sub">${MVORD.lines.length?`${MVORD.lines.length} 項，共 ${nf(sum)} 個　填表人 ${esc(filler)}`:'還沒有明細'}</span></h2>
    ${canW?'':'<div class="ro-banner">你是唯讀權限，只能查看歷史單據，不能送出異動。</div>'}
    ${dept?'':`<div class="ro-banner">找不到「${esc(filler)}」的申請部門。

    ${over>0?`<div class="ro-banner">目前 ${MVORD.lines.length} 項，超過一張單的上限 ${MAX_LINES} 項。
      送出時只會扣<b>前 ${MAX_LINES} 項</b>並發一個單號，剩下的 ${over} 項會留在這裡，再按一次送出就是下一張單。</div>`:''}
    <div class="row">
      <div><label class="mini">類別</label><br>
        <select id="ov_type" style="width:110px" onchange="mvHead('type',this.value)">
          ${MOVE_TYPES.map(t=>`<option value="${t}"${MVORD.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
      <div><label class="mini">倉別</label><br>
        <select id="ov_house" style="width:110px" onchange="mvHead('house',this.value)">
          ${HOUSES.map(h=>`<option value="${h}"${MVORD.house===h?' selected':''}>${h}</option>`).join('')}</select></div>
      <div><label class="mini">日期</label><br>
        <input type="date" style="width:150px" value="${esc(MVORD.date)}" onchange="mvHead('date',this.value)"></div>
      <div><label class="mini">申請部門${dept?'':' <span class="tag bad">待確認</span>'}</label><br>
        <select style="width:120px" onchange="mvHead('dept',this.value)">
          <option value=""${dept?'':' selected'}>請選擇…</option>

        </select></div>
      <div><label class="mini">領用人</label><br>
        <input style="width:120px" list="mv_staff" value="${esc(MVORD.taker)}" onchange="mvHead('taker',this.value)">
        <datalist id="mv_staff">${staffList().map(x=>`<option value="${esc(x.name)}">${esc(x.alias||'')}　${esc(x.dept)}</option>`).join('')}</datalist></div>
      <div class="grow"><label class="mini">異動原因（會印在 Word 單上）*</label><br>
        <input style="width:100%" value="${esc(MVORD.reason)}" placeholder="例：研發領料_耳鏡測試裸板"
          onchange="mvHead('reason',this.value)"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="grow"><label class="mini">單據備註</label><br>
        <input style="width:100%" value="${esc(MVORD.memo)}" onchange="mvHead('memo',this.value)"></div>
    </div>
    ${MVORD.lines.length?`<div class="tblwrap" style="margin-top:12px;max-height:340px"><table><thead><tr>
        <th class="nos">項次</th><th class="nos">品號</th><th class="nos">品名</th>
        <th class="nos num">數量</th><th class="nos">單位</th>
        <th class="nos num">目前庫存</th><th class="nos num">異動後</th>
        <th class="nos">備註（不印在單上）</th><th class="nos"></th></tr></thead><tbody>
      ${MVORD.lines.map((l,ix)=>{
        const it=itemOf(l.code), sg=MVORD.type==='領料'?-1:1, af=(it.stock||0)+sg*(+l.qty||0);
        return `<tr><td class="num mut">${ix+1}</td><td class="mono">${esc(l.code)}</td>
        <td>${esc(l.name)}</td>
        <td class="num"><input type="number" min="0" step="any" style="width:90px;text-align:right"
            value="${l.qty}" onchange="mvQty(${ix},this.value)"></td>
        <td class="mut">${esc(l.unit)}</td>
        <td class="num mut">${nf(it.stock)}</td>
        <td class="num ${af<0?'':''}"><b class="${sg>0?'mv-in':'mv-out'}">${nf(af)}</b>${af<0?' <span class="tag bad">負數</span>':''}</td>
        <td><input style="width:100%" value="${esc(l.note)}" onchange="mvNote(${ix},this.value)"></td>
        <td class="num"><button class="btn sm danger" onclick="mvDel(${ix})">✕</button></td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px">
        ${canW?'<button class="btn pri" onclick="mvSubmit()">送出單據並扣帳</button>':''}
        <button class="btn" onclick="mvPreviewDoc()">預覽 Word 單</button>
        ${canW?'<button class="btn danger" onclick="mvClear()">清空</button>':''}
        <div class="grow"></div>
        <span class="mini ${over>0?'':'mut'}">${MVORD.lines.length} / ${MAX_LINES} 項${over>0?`（超過 ${over} 項會留到下一張單）`:''}</span>

    :`<div class="empty" style="margin-top:12px">到「料號主檔」或「BOM 管理」，在任一列按 <b>異動</b> 就會加到這裡。</div>`}
  </div>`;

  const list=moveOrders();
  const hist=`
  <div class="card">
    <h2>歷史單據 <span class="sub">${moveSt.ym?`${moveSt.ym.slice(0,4)}/${moveSt.ym.slice(4)}　`:''}共 ${list.length} 張${(S.moves||[]).length?`／${S.moves.length} 筆明細`:''}</span></h2>

      </div>
      <select id="mvym" style="width:auto;min-width:130px">

      </select>
      <button class="btn pri" onclick="exportMovesMonth()">${moveSt.ym?`匯出 ${moveSt.ym.slice(0,4)}/${moveSt.ym.slice(4)}`:'匯出本月'} Excel</button>
      <button class="btn" onclick="exportMoves()">匯出全部</button>
    </div>
    ${list.length?`<div class="tblwrap" style="max-height:60vh"><table><thead><tr>
      <th class="nos">單號</th><th class="nos">日期</th><th class="nos">類別</th><th class="nos">倉別</th>
      <th class="nos">異動原因</th><th class="nos num">項數</th><th class="nos">領用人</th>
      <th class="nos">填表人</th><th class="nos" style="width:210px">操作</th></tr></thead><tbody>
      ${list.map(o=>`<tr style="cursor:pointer" onclick="mvToggle('${esc(o.no)}')">
        <td class="mono"><b>${esc(o.no)}</b></td><td class="mut">${esc(o.date)}</td>
        <td><span class="tag ${o.type==='領料'?'bad':(o.type==='入庫'?'ok':'warn')}">${esc(o.type)}</span></td>
        <td class="mut">${esc(o.house)}</td><td>${esc(o.reason)}</td>
        <td class="num">${o.lines.length}</td><td class="mut">${esc(o.taker)}</td><td class="mut">${esc(o.by)}</td>
        <td onclick="event.stopPropagation()">
          <button class="btn sm" onclick="mvDoc('${esc(o.no)}')">Word</button>
          <button class="btn sm" onclick="mvToggle('${esc(o.no)}')">${moveSt.open===o.no?'收合':'明細'}</button>
          ${isAdmin()?`<button class="btn sm danger" onclick="mvDelOrder('${esc(o.no)}')" title="刪除這張單並回沖庫存">刪除</button>`:''}</td></tr>
        ${moveSt.open===o.no?`<tr><td colspan="9" style="background:#fafbfc;padding:10px 14px">
          <table style="font-size:12.5px"><thead><tr><th class="nos">項次</th><th class="nos">品號</th>
            <th class="nos">品名</th><th class="nos num">數量</th><th class="nos">單位</th>
            <th class="nos num">異動前</th><th class="nos num">異動後</th><th class="nos">備註</th></tr></thead><tbody>
            ${o.lines.map(l=>`<tr><td class="num mut">${l.seq}</td><td class="mono">${esc(l.code)}</td>
              <td>${esc(l.name)}</td><td class="num"><b class="${o.type==='領料'?'mv-out':'mv-in'}">${o.type==='領料'?'-':'+'}${nf(l.qty)}</b></td>
              <td class="mut">${esc(l.unit)}</td><td class="num mut">${nf(l.before)}</td>
              <td class="num">${nf(l.after)}</td><td class="mut">${esc(l.note)}</td></tr>`).join('')}
          </tbody></table>
          ${o.memo?`<div class="mini" style="margin-top:8px">單據備註：${esc(o.memo)}</div>`:''}
          <div class="mini mut" style="margin-top:4px">建立於 ${esc(o.at)}</div></td></tr>`:''}`).join('')}
    </tbody></table></div>`
    :`<div class="empty">${(S.moves||[]).length?'查無符合的單據':'還沒有任何異動單'}</div>`}
  </div>`;

function exportMoves(){
  const src=S.moves||[];
  if(!src.length) return toast('沒有可匯出的紀錄');
  const wb=XLSX.utils.book_new();
  /* 分頁一：系統完整欄位 */
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(src.map(m=>({
    '單號':m.no,'日期':m.date,'類別':m.type,'倉別':m.house,'申請部門':m.dept,
    '異動原因':m.reason,'項次':m.seq,'品號':m.code,'品名':m.name,'數量':m.qty,'單位':m.unit,
    '異動前庫存':m.before,'異動後庫存':m.after,'領用人':m.taker,'填表人':m.by,
    '備註':m.note,'單據備註':m.memo,'建立時間':m.at}))),'庫存異動');
  /* 分頁二：對齊庫存系統「簡易領料紀錄」的欄位，可直接貼回原本的 Excel */
  let lastNo='';
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(src.map(m=>{
    const d=String(m.date||'').replace(/[^0-9]/g,'');           // 20260806
    const head = m.no!==lastNo; lastNo=m.no;
    return {
      '年分': d.slice(0,4),
      '日期YYMMDD': head ? d.slice(2) : '',                      // 同一張單只在第一列填
      '領料單號PPYYMMXXX': head ? m.no : '',
      '料號': m.code, '品名': m.name, '數量': m.qty,
      '領用': m.taker || m.by,
      '用途': head ? m.reason : '',
      '確認扣料': m.by,
      '備註': [m.note, m.type!=='領料'?('（'+m.type+'）'):''].filter(Boolean).join(' ')
    };
  })),'簡易領料紀錄');
  XLSX.writeFile(wb,'庫存異動紀錄_'+todayStr().replace(/-/g,'')+'.xlsx');
}

const WRITE_FNS=['saveItem','editItem','delItem','bulkAdd','bulkSave',
  'addMove','doAddMove','mvSubmit','doMvSubmit','mvClear','doMvClear',
  'mvDelOrder','doMvDelOrder',
  'stEdit','stAdd','stDel','stSave',

  'setCostMode','resetSeed','wipe','restoreLastGood'];
function installWriteGuard(){
  WRITE_FNS.forEach(function(n){
    const f=window[n];
    if(typeof f!=='function' || f._guarded) return;
    const g=function(){ if(!canWrite()){ denyWrite(); return; } return f.apply(this,arguments); };
    g._guarded=true; window[n]=g;
  });
}

const KEEP_FNS = ['mvPreviewDoc','mvDoc','mvToggle','exportMoves'];
function applyReadonlyUI(){

    const m = String(el.getAttribute('onclick')||'').match(/^\s*([A-Za-z0-9_]+)\s*\(/);
    if(!m) return;
    if(KEEP_FNS.indexOf(m[1]) >= 0) return;

    el.style.display = ro ? 'none' : '';
  });
}

function ymOf(d){ const s=String(d||'').replace(/[^0-9]/g,''); return s.length>=6?s.slice(0,6):''; }

  const set={}; (S.moves||[]).forEach(m=>{ const y=ymOf(m.date); if(y) set[y]=1; });

function exportMovesMonth(){

  const src=all.filter(m=>ymOf(m.date)===ym);

    byNo[m.no].n++; byNo[m.no].q += (+m.qty||0); });
  const orders=order.map(no=>{ const o=byNo[no], h=o.h;
    return {'單號':no,'日期':h.date,'類別':h.type,'倉別':h.house,'申請部門':h.dept,

  toast(ym.slice(0,4)+'/'+ym.slice(4)+' 已匯出：'+order.length+' 張單、'+src.length+' 筆明細');

let XLSXS=null;
function ensureStyledXlsx(){
  if(XLSXS) return Promise.resolve(XLSXS);
  return new Promise((res,rej)=>{
    const keepX=window.XLSX, keepZ=window.JSZip;
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload=()=>{ XLSXS=window.XLSX; window.XLSX=keepX; if(keepZ) window.JSZip=keepZ; res(XLSXS); };
    s.onerror=()=>{ window.XLSX=keepX; if(keepZ) window.JSZip=keepZ;
      rej(new Error('載入表單元件失敗，請確認網路後再試')); };
    document.head.appendChild(s);
  });
}
const F_KAI='DFKai-SB', F_KAI2='標楷體', F_TNR='Times New Roman';

function BD(l,r,t,b){
  const o={}; if(l)o.left={style:l}; if(r)o.right={style:r};
  if(t)o.top={style:t}; if(b)o.bottom={style:b}; return o;
}
function CL(v,st){
  const c={};
  if(v===null||v===undefined||v===''){ c.t='s'; c.v=''; }
  else if(typeof v==='number'){ c.t='n'; c.v=v; }
  else { c.t='s'; c.v=String(v); }
  if(st) c.s=st; return c;
}

    merges.push({s:{r:r-1,c:4},e:{r:r-1,c:5}});
    put(7,r,l.spec,{font:{name:F_KAI2,sz:8},alignment:{vertical:'center',wrapText:true},border:BD('thin','thin','thin','thin')});
    put(8,r,l.qty,{font:{name:F_KAI2,sz:12},alignment:{horizontal:'center',vertical:'center'},border:BD('thin','thin','thin','thin')});
    put(9,r,l.unit,{font:{name:F_KAI2,sz:12},alignment:{horizontal:'center',vertical:'center'},border:BD('thin','thin','thin','thin')});
    put(10,r,l.cost===null?'':l.cost,{font:{name:F_KAI2,sz:12},alignment:{horizontal:'center',vertical:'center'},border:BD('thin','thin','thin','thin')});
    put(11,r,l.price===null?'':l.price,{font:{name:F_KAI2,sz:12},alignment:{horizontal:'center',vertical:'center'},border:BD('thin','thin','thin','thin')});
    put(12,r,l.stock,{font:{name:F_KAI2,sz:12},alignment:{horizontal:'center',vertical:'center'},border:BD('thin','thin','thin','thin')});
    ws[A1(13,r)]=CL('',{border:BD(null,null,'thin','thin')});
    ws[A1(14,r)]=CL('',{border:BD(null,'thin','thin','thin')});
    merges.push({s:{r:r-1,c:11},e:{r:r-1,c:13}});
    put(15,r,l.note,{font:{name:F_KAI2,sz:11},alignment:{vertical:'center',wrapText:true},border:BD('thin','medium','thin','thin')});
  });

  const lastRow=7+lines.length;
  ws['!ref']='A1:'+A1(16,Math.max(lastRow,10));
  ws['!merges']=merges;
  ws['!cols']=[1.66,5.16,5,17.16,9.83,21.33,14.16,6.66,5.66,5.66,8,5.16,5,10.33,20.83,2.66]
    .map(w=>({wch:Math.max(0.6,w-0.83)}));
  rowsH[0]={hpt:33}; rowsH[1]={hpt:18}; rowsH[2]={hpt:18}; rowsH[3]={hpt:18}; rowsH[4]={hpt:9.75};
  for(let r=5;r<lastRow;r++) rowsH[r]={hpt:18.75};
  ws['!rows']=rowsH;

  /* ---------- 封面 ---------- */
  const cv={}, cm=[];
  cv['B6']=CL('安德斯醫學科技股份有限公司',{font:{name:F_KAI,sz:36,bold:true},alignment:{horizontal:'center',vertical:'center'}});
  cm.push({s:{r:5,c:1},e:{r:7,c:20}});
  cv['B9']=CL('EndoSemio Co., Ltd.',{font:{name:F_TNR,sz:22,bold:true},alignment:{horizontal:'center',vertical:'center'}});
  cm.push({s:{r:8,c:1},e:{r:9,c:20}});
  cv['B14']=CL(bom.code+'  BOM',{font:{name:F_TNR,sz:26,bold:true},alignment:{horizontal:'center',vertical:'center'}});
  cm.push({s:{r:13,c:1},e:{r:16,c:20}});
  const cvL={font:{name:F_TNR,sz:12,bold:true},alignment:{vertical:'center'}};
  const cvV={font:{name:F_KAI2,sz:13},alignment:{vertical:'center'}};
  const info=[['產品名稱：',bom.name||''],['料件號碼：',bom.code],
              ['文件編號：',''],['日期：',dstr],['版本：','A']];
  info.forEach((x,i)=>{ const r=25+i;
    cv['I'+r]=CL(x[0],cvL); cv['K'+r]=CL(x[1],cvV);
    cm.push({s:{r:r-1,c:8},e:{r:r-1,c:9}});
    cm.push({s:{r:r-1,c:10},e:{r:r-1,c:14}});
  });
  cv['!ref']='A1:U32'; cv['!merges']=cm;
  cv['!cols']=[1.66,5.16].concat(new Array(19).fill(5)).map(w=>({wch:Math.max(0.6,w-0.83)}));

  /* ---------- 修改歷史 ---------- */
  const hs={}, hm=[];
  hs['B2']=CL('安德斯醫學科技股份有限公司',{font:{name:F_KAI,sz:18,bold:true},alignment:{horizontal:'center',vertical:'center'}});
  hm.push({s:{r:1,c:1},e:{r:1,c:7}});
  hs['B3']=CL('EndoSemio Co., Ltd.',{font:{name:F_KAI,sz:18},alignment:{horizontal:'center',vertical:'center'}});
  hm.push({s:{r:2,c:1},e:{r:2,c:7}});
  hs['B5']=CL('標題',{font:{name:F_KAI,sz:11,bold:true},alignment:{vertical:'center'},border:thin});
  hs['C5']=CL(bom.code+'  BOM',{font:{name:F_KAI2,sz:11},alignment:{vertical:'center'},border:thin});
  hm.push({s:{r:4,c:2},e:{r:4,c:7}});
  const hh=['項次','內容和更新項目','版本','日期','修訂','核准','備註'];
  hh.forEach((t,i)=>{ hs[A1(2+i,6)]=CL(t,{font:{name:F_KAI,sz:11,bold:true},
    alignment:{horizontal:'center',vertical:'center'},fill:HEADFILL,border:thin}); });
  for(let i=0;i<15;i++){ const r=7+i;
    hs[A1(2,r)]=CL(i+1,{font:{name:F_TNR,sz:11},alignment:{horizontal:'center',vertical:'center'},border:thin});
    for(let c=3;c<=8;c++) hs[A1(c,r)]=CL(i===0&&c===3?'首次發行（由 BOM 管理系統匯出）':
        (i===0&&c===4?'A':(i===0&&c===5?dstr:'')),
      {font:{name:F_KAI2,sz:11},alignment:{vertical:'center',wrapText:true},border:thin});
  }
  hs['!ref']='A1:J22'; hs['!merges']=hm;
  hs['!cols']=[1.66,4.33,73.33,6,7,6.83,6.83,18.83,1.66,8.16].map(w=>({wch:Math.max(0.6,w-0.83)}));

  return {cover:cv, hist:hs, bom:ws};
}

async function exportBomForm(){
  const bom=BIDX[curBom];
  if(!bom) return toast('請先選擇一張 BOM');
  let X;
  try{ X=await ensureStyledXlsx(); }
  catch(e){ return toast(e.message||'載入表單元件失敗'); }
  const sh=bomFormSheets(bom);
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,sh.cover,'封面');
  X.utils.book_append_sheet(wb,sh.hist,'修改歷史');
  X.utils.book_append_sheet(wb,sh.bom,'BOM');
  const d=new Date(), p=n=>(n<10?'0':'')+n;
  X.writeFile(wb,'BOM_'+bom.code+'_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.xlsx');
  toast('已匯出材料清單-BOM 表單');
}
